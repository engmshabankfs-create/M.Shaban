<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Mohamed Shaban</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --secondary: #8a8a8e;
    --blue: #007aff;
    --separator: #e5e5ea;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #98989d;
      --blue: #0a84ff;
      --separator: #38383a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  [data-theme="dark"]{
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --secondary: #98989d;
    --blue: #0a84ff;
    --separator: #38383a;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position: sticky;
    top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--separator);
    z-index: 10;
    flex-wrap:wrap;
  }
  .back-btn, .download-btn{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    border-radius: 20px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor:pointer;
    box-shadow: var(--shadow);
    text-decoration:none;
  }
  .back-btn{ background: var(--card); color: var(--blue); }
  .download-btn{ background: var(--blue); color:#fff; }
  .back-btn:active, .download-btn:active{ transform: scale(0.96); }

  .cv-container{
    max-width: 900px;
    margin: 16px auto;
    padding: 0 12px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 16px;
  }

  .cv-image-wrapper{
    width:100%;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow:hidden;
    padding: 10px;
  }
  .cv-image-wrapper img{
    width:100%;
    height:auto;
    display:block;
    border-radius: 8px;
  }

  .info-bar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    padding: 12px 16px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .info-bar .label{
    color: var(--secondary);
    font-size:13px;
  }
  .info-bar .label i{
    color: var(--blue);
    margin-left:6px;
  }
  .info-bar .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .info-bar .actions a{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 8px 14px;
    border-radius: 20px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    transition: transform 0.1s ease;
  }
  .info-bar .actions a:active{ transform:scale(0.96); }
  .info-bar .actions .btn-primary{
    background: var(--blue);
    color:#fff;
  }
  .info-bar .actions .btn-secondary{
    background: var(--bg);
    color: var(--blue);
  }

  .zoom-controls{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 8px 12px;
    background: var(--card);
    border-radius: 30px;
    box-shadow: var(--shadow);
  }
  .zoom-controls button{
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background: var(--bg);
    color: var(--text);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
  }
  .zoom-controls button:active{ transform:scale(0.92); background: var(--separator); }
  .zoom-controls .zoom-level{
    font-size:13px;
    font-weight:600;
    color: var(--secondary);
    min-width:40px;
    text-align:center;
  }

  @media (max-width:600px){
    .topbar{ justify-content:center; }
    .info-bar{ flex-direction:column; align-items:stretch; text-align:center; }
    .info-bar .actions{ justify-content:center; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="index.html">
      <i class="fas fa-arrow-right"></i> رجوع للصفحة الرئيسية
    </a>
    <a class="download-btn" href="cv.pdf" download>
      <i class="fas fa-file-download"></i> تحميل PDF
    </a>
  </div>

  <div class="cv-container">
    <!-- معاينة الصورة -->
    <div class="cv-image-wrapper" id="imageWrapper">
      <img id="cvImage" src="image.png" alt="السيرة الذاتية - محمد شعبان">
    </div>

    <!-- شريط المعلومات والأزرار -->
    <div class="info-bar">
      <span class="label">
        <i class="fas fa-file-image"></i> معاينة السيرة الذاتية
      </span>
      <div class="actions">
        <a class="btn-secondary" href="image.png" download="cv.png">
          <i class="fas fa-download"></i> تحميل الصورة
        </a>
        <a class="btn-primary" href="cv.pdf" download>
          <i class="fas fa-file-pdf"></i> تحميل PDF
        </a>
      </div>
    </div>

    <!-- أدوات التكبير -->
    <div class="zoom-controls">
      <button id="zoomOut" type="button" aria-label="تصغير">−</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button id="zoomIn" type="button" aria-label="تكبير">+</button>
      <button id="zoomReset" type="button" aria-label="إعادة ضبط" style="width:auto;padding:0 12px;border-radius:16px;font-size:12px;">↺</button>
    </div>
  </div>

  <script>
    // تطبيق الثيم
    (function(){
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();

    // === نظام التكبير ===
    const img = document.getElementById('cvImage');
    const zoomLevelEl = document.getElementById('zoomLevel');
    let currentZoom = 1;
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 3;
    const STEP = 0.1;

    function updateZoom() {
      img.style.transform = `scale(${currentZoom})`;
      img.style.transformOrigin = 'top left';
      zoomLevelEl.textContent = Math.round(currentZoom * 100) + '%';
    }

    document.getElementById('zoomIn').addEventListener('click', () => {
      if (currentZoom < MAX_ZOOM) {
        currentZoom = Math.min(currentZoom + STEP, MAX_ZOOM);
        updateZoom();
      }
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      if (currentZoom > MIN_ZOOM) {
        currentZoom = Math.max(currentZoom - STEP, MIN_ZOOM);
        updateZoom();
      }
    });

    document.getElementById('zoomReset').addEventListener('click', () => {
      currentZoom = 1;
      updateZoom();
    });

    // دعم اللمس (pinch to zoom) على الموبايل
    let lastTouchDist = 0;
    const wrapper = document.getElementById('imageWrapper');

    wrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const t = e.touches;
        lastTouchDist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      }
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && lastTouchDist > 0) {
        const t = e.touches;
        const dist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        const delta = (dist - lastTouchDist) / 200;
        currentZoom = Math.min(Math.max(currentZoom + delta, MIN_ZOOM), MAX_ZOOM);
        updateZoom();
        lastTouchDist = dist;
      }
    }, { passive: true });

    wrapper.addEventListener('touchend', () => { lastTouchDist = 0; }, { passive: true });
  </script>
</body>
</html>
