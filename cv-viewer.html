<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>CV - Mohamed Shaban</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --secondary: #8a8a8e;
    --blue: #007aff;
    --separator: #e5e5ea;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #98989d;
      --blue: #0a84ff;
      --separator: #38383a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  [data-theme="dark"]{
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --secondary: #98989d;
    --blue: #0a84ff;
    --separator: #38383a;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position: sticky;
    top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--separator);
    z-index: 10;
    flex-wrap:wrap;
  }
  .back-btn, .download-btn{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    border-radius: 20px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor:pointer;
    box-shadow: var(--shadow);
    text-decoration:none;
  }
  .back-btn{ background: var(--card); color: var(--blue); }
  .download-btn{ background: var(--blue); color:#fff; }
  .back-btn:active, .download-btn:active{ transform: scale(0.96); }

  .cv-container{
    max-width: 1000px;
    margin: 16px auto;
    padding: 0 12px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 16px;
  }

  .page-wrapper{
    width:100%;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow:hidden;
    padding: 10px;
  }
  .page-wrapper img{
    width:100%;
    height:auto;
    display:block;
    border-radius: 8px;
    background:#fff;
    transition: transform 0.15s ease;
    transform-origin: top left;
  }

  .controls-bar{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding: 10px 16px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .controls-bar .zoom-group{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--bg);
    border-radius: 30px;
    padding: 4px 6px;
  }
  .controls-bar .zoom-group button{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background: transparent;
    color: var(--text);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .controls-bar .zoom-group button:active{
    background: var(--separator);
    transform:scale(0.92);
  }
  .controls-bar .zoom-level{
    font-size:13px;
    font-weight:600;
    color: var(--secondary);
    min-width:44px;
    text-align:center;
  }
  .controls-bar .btn-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .controls-bar .btn-group a{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 8px 16px;
    border-radius: 20px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    background: var(--bg);
    color: var(--blue);
    transition: transform 0.1s ease;
  }
  .controls-bar .btn-group a:active{
    transform:scale(0.95);
  }
  .controls-bar .btn-group .primary{
    background: var(--blue);
    color:#fff;
  }

  .page-number{
    font-size:13px;
    color: var(--secondary);
    font-weight:500;
  }

  .loading-text{
    text-align:center;
    color: var(--secondary);
    font-size: 15px;
    padding: 40px 20px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    width:100%;
  }
  .loading-text .spinner{
    display:inline-block;
    width:32px;
    height:32px;
    border:3px solid var(--separator);
    border-top-color: var(--blue);
    border-radius:50%;
    animation: spin 0.8s linear infinite;
    margin-bottom:12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:600px){
    .topbar{ justify-content:center; }
    .page-wrapper{ padding:6px; }
    .controls-bar{ flex-direction:column; }
    .controls-bar .btn-group{ justify-content:center; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="index.html">
      <i class="fas fa-arrow-right"></i> رجوع للصفحة الرئيسية
    </a>
    <a class="download-btn" href="cv.pdf" download>
      <i class="fas fa-file-download"></i> تحميل PDF
    </a>
  </div>

  <div class="cv-container" id="cvContainer">
    <div class="loading-text" id="loadingText">
      <div class="spinner"></div>
      جاري تحميل السيرة الذاتية ...
    </div>
  </div>

  <script>
    (function(){
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();

    const container = document.getElementById('cvContainer');
    const loadingText = document.getElementById('loadingText');

    // ============================================
    // 🔥 هنا اسماء الصور بالترتيب
    // ============================================
    const PAGES = [
      '11.jpg',
      '22.jpg'
    ];
    // ============================================

    let allImages = [];
    let currentZoom = 1;
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 4;
    const STEP = 0.1;

    function loadImages() {
      loadingText.remove();

      PAGES.forEach((src, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';

        const img = document.createElement('img');
        img.src = src + '?v=' + Date.now();
        img.alt = `السيرة الذاتية - صفحة ${index + 1}`;
        img.loading = 'lazy';
        img.dataset.page = index + 1;

        wrapper.appendChild(img);
        container.appendChild(wrapper);
        allImages.push(img);
      });

      setTimeout(addControls, 300);
    }

    function addControls() {
      const controls = document.createElement('div');
      controls.className = 'controls-bar';
      controls.innerHTML = `
        <div class="zoom-group">
          <button id="zoomOut" type="button">−</button>
          <span class="zoom-level" id="zoomLevel">100%</span>
          <button id="zoomIn" type="button">+</button>
          <button id="zoomReset" type="button" style="width:auto;padding:0 12px;border-radius:16px;font-size:13px;">↺</button>
        </div>
        <span class="page-number" id="pageInfo">صفحة 1 من ${allImages.length}</span>
        <div class="btn-group">
          <a href="cv.pdf" download class="primary">
            <i class="fas fa-file-download"></i> تحميل PDF
          </a>
          <a href="cv.pdf" target="_blank">
            <i class="fas fa-external-link-alt"></i> فتح PDF
          </a>
        </div>
      `;
      container.appendChild(controls);

      document.getElementById('zoomIn').addEventListener('click', () => {
        if (currentZoom < MAX_ZOOM) {
          currentZoom = Math.min(currentZoom + STEP, MAX_ZOOM);
          updateZoom();
        }
      });
      document.getElementById('zoomOut').addEventListener('click', () => {
        if (currentZoom > MIN_ZOOM) {
          currentZoom = Math.max(currentZoom - STEP, MIN_ZOOM);
          updateZoom();
        }
      });
      document.getElementById('zoomReset').addEventListener('click', () => {
        currentZoom = 1;
        updateZoom();
      });

      let lastDist = 0;
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const t = e.touches;
          lastDist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && lastDist > 0) {
          const t = e.touches;
          const dist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
          const delta = (dist - lastDist) / 300;
          currentZoom = Math.min(Math.max(currentZoom + delta, MIN_ZOOM), MAX_ZOOM);
          updateZoom();
          lastDist = dist;
        }
      }, { passive: true });

      container.addEventListener('touchend', () => { lastDist = 0; }, { passive: true });

      updatePageNumber();
      container.addEventListener('scroll', updatePageNumber, { passive: true });
    }

    function updateZoom() {
      allImages.forEach(img => {
        img.style.transform = `scale(${currentZoom})`;
        img.style.transformOrigin = 'top left';
      });
      document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
    }

    function updatePageNumber() {
      const wrappers = container.querySelectorAll('.page-wrapper');
      let visiblePage = 1;
      let minDist = Infinity;
      const center = window.innerHeight / 2;

      wrappers.forEach((wrapper, index) => {
        const rect = wrapper.getBoundingClientRect();
        const dist = Math.abs(rect.top + rect.height/2 - center);
        if (dist < minDist) {
          minDist = dist;
          visiblePage = index + 1;
        }
      });

      const info = document.getElementById('pageInfo');
      if (info) {
        info.textContent = `صفحة ${visiblePage} من ${allImages.length}`;
      }
    }

    loadImages();
  </script>
</body>
</html>
