<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Mohamed Shaban</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --secondary: #8a8a8e;
    --blue: #007aff;
    --separator: #e5e5ea;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #98989d;
      --blue: #0a84ff;
      --separator: #38383a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  [data-theme="dark"]{
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --secondary: #98989d;
    --blue: #0a84ff;
    --separator: #38383a;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position: sticky;
    top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--separator);
    z-index: 10;
  }
  .back-btn, .download-btn{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    border-radius: 20px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor:pointer;
    box-shadow: var(--shadow);
    text-decoration:none;
  }
  .back-btn{ background: var(--card); color: var(--blue); }
  .download-btn{ background: var(--blue); color:#fff; }
  .back-btn:active, .download-btn:active{ transform: scale(0.96); }

  .cv-container{
    max-width: 900px;
    margin: 16px auto;
    padding: 0 12px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  /* ===== عرض PDF باستخدام iframe (حل بسيط) ===== */
  .pdf-iframe-wrapper{
    width:100%;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow:hidden;
    padding: 8px;
  }
  .pdf-iframe-wrapper iframe{
    width:100%;
    height: 600px;
    border:0;
    border-radius: 8px;
    background:#fff;
    display:block;
  }

  /* ===== عرض الصورة (لو الـ PDF مش واضح) ===== */
  .cv-image-wrapper{
    width:100%;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow:hidden;
    padding: 8px;
  }
  .cv-image-wrapper img{
    width:100%;
    height:auto;
    display:block;
    border-radius: 8px;
  }

  .fallback-message{
    text-align:center;
    color: var(--secondary);
    font-size: 14px;
    padding: 20px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    width:100%;
  }
  .fallback-message a{
    color: var(--blue);
    text-decoration:none;
    font-weight:600;
  }

  @media (max-width:600px){
    .pdf-iframe-wrapper iframe{ height: 450px; }
    .topbar{ flex-wrap:wrap; justify-content:center; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="index.html">
      <i class="fas fa-arrow-right"></i> رجوع للصفحة الرئيسية
    </a>
    <a class="download-btn" href="cv.pdf" download>
      <i class="fas fa-file-download"></i> تحميل PDF
    </a>
  </div>

  <div class="cv-container" id="cvContainer">

    <!-- المعاينة باستخدام iframe (حل سريع ونظيف) -->
    <div class="pdf-iframe-wrapper">
      <iframe src="cv.pdf#toolbar=0" title="السيرة الذاتية - محمد شعبان"></iframe>
    </div>

    <!-- رسالة توضيحية في حالة عدم ظهور الـ PDF -->
    <div class="fallback-message">
      <i class="fas fa-info-circle" style="color:var(--blue);"></i>
      إذا لم تظهر المعاينة، 
      <a href="cv.pdf" target="_blank">اضغط هنا لفتح الملف</a>
      أو استخدم زر التحميل بالأعلى.
    </div>

    <!-- صورة بديلة لو حابب تعرضها (علقها أو اشطبها لو مش عايزها) -->
    <!-- 
    <div class="cv-image-wrapper">
      <img src="cv.png" alt="السيرة الذاتية">
    </div>
    -->

  </div>

  <script>
    // تطبيق الثيم المختار من localStorage
    (function(){
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>

</body>
</html>
