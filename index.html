  <style>
  /* =====================================================================
     MS iOS ENGINEERING — DESIGN SYSTEM SKIN
     01 tokens · 02 base · 03 corner controls · 04 hero · 05 quick actions
     06 cards & inset rows · 07 buttons · 08 CV viewer · 09 footer
     10 screens/overlays · 11 tiles & grids · 12 project detail
     13 lightboxes · 14 sheets · 15 toast · 16 skeleton · 17 responsive
     ===================================================================== */

  /* ---------- 01. TOKENS ---------- */
  :root{
    color-scheme: light;
    --bg:        #f2f2f7;
    --card:      #ffffff;
    --text:      #1c1c1e;
    --secondary: #8a8a8e;
    --blue:      #007aff;
    --separator: #e5e5ea;
    --green:     #34c759;
    --red:       #ff3b30;
    --orange:    #ff9500;
    --shadow:    0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    --sheet-bg:  rgba(255,255,255,.97);
    --fill:      rgba(120,120,128,.12);
    --fill-2:    rgba(120,120,128,.18);
    --chev:      #c7c7cc;
    --field:     #f2f2f7;
    --raised:    #ffffff;
    --wash:      rgba(0,122,255,.08);
    --header-bg: rgba(242,242,247,.86);
    --ring:      0 0 0 3px rgba(0,122,255,.28);
  }

  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:        #000000;
    --card:      #1c1c1e;
    --text:      #f2f2f7;
    --secondary: #98989d;
    --blue:      #0a84ff;
    --separator: #38383a;
    --shadow:    0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --sheet-bg:  rgba(28,28,30,.97);
    --fill:      rgba(120,120,128,.18);
    --fill-2:    rgba(120,120,128,.26);
    --chev:      #5a5a5e;
    --field:     #2c2c2e;
    --raised:    #3a3a3c;
    --wash:      rgba(10,132,255,.16);
    --header-bg: rgba(0,0,0,.72);
    --ring:      0 0 0 3px rgba(10,132,255,.38);
  }

  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      color-scheme: dark;
      --bg:        #000000;
      --card:      #1c1c1e;
      --text:      #f2f2f7;
      --secondary: #98989d;
      --blue:      #0a84ff;
      --separator: #38383a;
      --shadow:    0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --sheet-bg:  rgba(28,28,30,.97);
      --fill:      rgba(120,120,128,.18);
      --fill-2:    rgba(120,120,128,.26);
      --chev:      #5a5a5e;
      --field:     #2c2c2e;
      --raised:    #3a3a3c;
      --wash:      rgba(10,132,255,.16);
      --header-bg: rgba(0,0,0,.72);
      --ring:      0 0 0 3px rgba(10,132,255,.38);
    }
  }

  /* ---------- 02. BASE ---------- */
  *, *::before, *::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    min-height:100vh;
    display:block;                       /* never flex-centre the page */
    padding:64px 16px 56px;              /* clears the fixed corner controls */
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Tahoma,
                "Helvetica Neue", Arial, sans-serif;
    font-size:15px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background .3s ease, color .3s ease;
  }

  svg{ display:block; }
  button{ font-family:inherit; }
  a{ text-decoration:none; }
  ::selection{ background:rgba(0,122,255,.18); }

  .container{
    width:100%;
    max-width:400px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  :focus-visible{
    outline:none;
    box-shadow:var(--ring);
    border-radius:12px;
  }

  .sprite{ position:absolute; width:0; height:0; overflow:hidden; }

  /* ---------- 03. FIXED CORNER CONTROLS ---------- */
  .lang-toggle,
  .theme-toggle{
    position:fixed;
    top:18px;
    height:40px;
    border:none;
    background:var(--card);
    color:var(--text);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    transition:background .3s ease, color .3s ease, transform .12s ease;
  }
  .lang-toggle:active,
  .theme-toggle:active{ transform:scale(.93); }

  .lang-toggle{
    left:18px;
    right:auto;
    gap:7px;
    padding:0 14px;
    border-radius:20px;
    font-size:13.5px;
    font-weight:700;
    line-height:1;
    letter-spacing:0;
  }
  .lang-toggle svg{ width:16px; height:16px; color:var(--blue); }

  .theme-toggle{
    right:18px;
    left:auto;
    width:40px;
    padding:0;
    border-radius:50%;
  }
  .theme-toggle svg{ width:17px; height:17px; color:var(--text); }
  .theme-toggle .i-moon{ display:block; }
  .theme-toggle .i-sun{ display:none; }

  html[data-theme="dark"] .theme-toggle .i-moon{ display:none; }
  html[data-theme="dark"] .theme-toggle .i-sun{ display:block; color:#ffd60a; }

  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]) .theme-toggle .i-moon{ display:none; }
    html:not([data-theme="light"]) .theme-toggle .i-sun{ display:block; color:#ffd60a; }
  }

  html[dir="rtl"] .lang-toggle{ left:auto; right:18px; }
  html[dir="rtl"] .theme-toggle{ right:auto; left:18px; }

  /* ---------- 04. HERO ---------- */
  .profile-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:22px;
  }

  .profile-pic{
    position:relative;
    width:140px;
    height:140px;
    border-radius:50%;
    overflow:hidden;
    padding:0;
    margin:0 0 14px;
    border:3px solid var(--card);
    background:var(--fill);
    box-shadow:var(--shadow);
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    transition:transform .16s ease;
  }
  .profile-pic:active{ transform:scale(.97); }
  .profile-pic img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 18%;
    display:block;
  }
  .avatar-fb{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:var(--wash);
    color:var(--blue);
    opacity:.72;
  }
  .avatar-fb svg{ width:54px; height:54px; }

  h1{
    font-size:clamp(21px, 5.4vw, 27px);
    font-weight:800;
    line-height:1.25;
    letter-spacing:-.3px;
    margin:0;
    color:var(--text);
  }
  html[dir="rtl"] h1{ letter-spacing:0; }

  .tagline{
    font-size:14.5px;
    font-weight:700;
    line-height:1.4;
    color:var(--blue);
    max-width:340px;
    margin:7px 0 0;
  }

  .status-line{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:22px;
    margin-top:5px;
    font-size:13.5px;
    font-weight:600;
    color:var(--secondary);
  }
  .typing{
    white-space:nowrap;
    overflow:hidden;
    color:var(--secondary);
    font-weight:700;
    padding-inline-end:2px;
    border-inline-end:2px solid var(--blue);
    animation:blink-cursor .8s steps(1) infinite;
  }
  @keyframes blink-cursor{ 50%{ border-color:transparent; } }

  /* ---------- 05. QUICK ACTIONS ---------- */
  .quick-actions{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .quick-action{
    background:var(--card);
    border:none;
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--text);
    transition:transform .1s ease, opacity .15s ease, background .2s ease;
  }
  .quick-action svg{ width:19px; height:19px; color:var(--blue); }
  .quick-action span{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:2.4em;
    font-size:11.5px;
    font-weight:600;
    line-height:1.2;
    text-align:center;
  }
  .quick-action:active{ transform:scale(.95); opacity:.85; }

  /* ---------- 06. CARDS & INSET ROWS ---------- */
  .card{
    background:var(--card);
    border-radius:14px;
    border:none;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:16px;
    padding:0;
  }

  .group-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--secondary);
    margin:0 0 8px;
    margin-inline-start:14px;
  }
  html[dir="rtl"] .group-title{ letter-spacing:0; text-transform:none; }

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 16px;
    margin:0;
    background:none;
    border:none;
    border-top:1px solid var(--separator);
    color:var(--text);
    position:relative;
    text-align:start;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    line-height:1.5;
    cursor:pointer;
    transition:background .15s ease;
  }
  .row:first-child{ border-top:none; }
  .row:active{ background:var(--fill-2); }
  .row:focus-visible{ box-shadow:inset var(--ring); }
  button.row{ appearance:none; -webkit-appearance:none; outline:none; }

  .row-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(120,120,128,.12);
    background:color-mix(in srgb, var(--tile, var(--blue)) 20%, transparent);
    color:var(--tile, var(--blue));
    transition:background .2s ease, color .2s ease;
  }
  .row-icon svg{
    width:19px;
    height:19px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));
  }

  .row-label{
    flex:1;
    min-width:0;
    font-size:15px;
    font-weight:600;
    text-align:start;
  }
  .row-label small{
    color:var(--secondary);
    font-weight:600;
    font-size:12.5px;
    margin-inline-start:5px;
    white-space:nowrap;
  }

  .row-chevron{
    width:12px;
    height:12px;
    flex-shrink:0;
    color:var(--chev);
  }
  html[dir="rtl"] .row-chevron{ transform:scaleX(-1); }
  html[dir="ltr"] .back-arrow{ transform:scaleX(-1); }

  /* ---------- 07. BUTTONS ---------- */
  .cv-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    padding:15px 18px;
    border:none;
    border-radius:13px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    line-height:1.2;
    text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease, background .2s ease, color .2s ease;
  }
  .btn svg{ width:18px; height:18px; flex-shrink:0; }
  .btn:active{ transform:scale(.985); opacity:.92; }

  .btn.solid{
    background:var(--blue);
    color:#fff;
    box-shadow:0 6px 18px rgba(0,122,255,.28);
  }
  .btn.outline{
    background:var(--fill);
    color:var(--blue);
    box-shadow:none;
  }

  /* ---------- 08. CV VIEWER ---------- */
  .cv-viewer{
    max-height:0;
    overflow:hidden;
    margin-top:0;
    border-radius:14px;
    background:var(--card);
    transition:max-height .35s ease, margin-top .35s ease;
  }
  .cv-viewer.open{
    max-height:620px;
    margin-top:0;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .cv-viewer iframe{
    width:100%;
    height:560px;
    border:0;
    border-radius:14px;
    background:#fff;
    display:block;
  }

  /* ---------- 09. FOOTER ---------- */
  footer{
    text-align:center;
    font-size:12px;
    font-weight:500;
    color:var(--secondary);
    line-height:1.7;
    max-width:400px;
    margin:24px auto 0;
  }

  /* ---------- 10. SCREENS / FULL-SCREEN OVERLAYS ---------- */
  .cert-overlay-backdrop{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:160;
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:opacity .24s ease, transform .24s ease;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .cert-overlay-backdrop.open{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .cert-overlay-header{
    position:sticky;
    top:0;
    z-index:2;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:58px;
    padding:12px 16px;
    background:var(--header-bg);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:inset 0 -1px 0 var(--separator);
  }

  .cert-overlay-back{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:6px;
    min-height:40px;
    padding:0 15px;
    background:var(--card);
    color:var(--blue);
    border:none;
    border-radius:20px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .12s ease, background .2s ease;
  }
  .cert-overlay-back svg{ width:14px; height:14px; }
  .cert-overlay-back:active{ transform:scale(.95); }

  .cert-overlay-title{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    max-width:calc(100% - 148px);
    text-align:center;
    font-size:16.5px;
    font-weight:800;
    letter-spacing:-.2px;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    pointer-events:none;
  }
  html[dir="rtl"] .cert-overlay-title{ letter-spacing:0; }

  .cert-overlay-body{
    padding:16px 16px 48px;
    max-width:400px;
    margin:0 auto;
  }

  /* ---------- 11. TILES & GRIDS ---------- */
  .cert-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-bottom:16px;
  }

  .cert-category-item{
    background:var(--card);
    border:none;
    border-radius:14px;
    box-shadow:var(--shadow);
    cursor:pointer;
    padding:20px 10px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    font-family:inherit;
    color:var(--text);
    transition:transform .1s ease, opacity .15s ease, background .2s ease;
  }
  .cert-category-item:active{ transform:scale(.97); opacity:.9; }
  a.cert-category-item{ text-decoration:none; color:inherit; }

  .cert-category-icon{
    width:56px;
    height:56px;
    border-radius:16px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(120,120,128,.12);
    background:color-mix(in srgb, var(--tile, var(--blue)) 20%, transparent);
    color:var(--tile, var(--blue));
  }
  .cert-category-icon svg{
    width:26px;
    height:26px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));
  }
  .cert-category-icon.has-logo{
    background:var(--card);
    padding:9px;
    box-shadow:inset 0 0 0 1px var(--separator);
  }
  .cert-category-icon.has-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .cert-category-label{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    text-align:center;
    line-height:1.3;
    word-break:break-word;
  }
  .cert-category-count{
    font-size:12px;
    font-weight:600;
    color:var(--secondary);
    text-align:center;
    line-height:1.3;
  }

  /* dark mode: neutral tile wash, glyph keeps its hue */
  html[data-theme="dark"] .row-icon,
  html[data-theme="dark"] .cert-category-icon:not(.has-logo){ background:rgba(255,255,255,.09); }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]) .row-icon,
    html:not([data-theme="light"]) .cert-category-icon:not(.has-logo){ background:rgba(255,255,255,.09); }
  }

  /* certificate thumbnails */
  .cert-item{
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
    cursor:pointer;
    border:none;
    padding:0;
    font-family:inherit;
    text-align:start;
    transition:transform .1s ease, opacity .15s ease;
  }
  .cert-item:active{ transform:scale(.97); opacity:.9; }
  .cert-item img{
    width:100%;
    height:108px;
    object-fit:cover;
    display:block;
    background:var(--fill);
    opacity:0;
    transition:opacity .25s ease;
  }
  .cert-item img.loaded{ opacity:1; }
  .cert-item .cert-label{
    padding:8px 10px 10px;
    font-size:12.5px;
    font-weight:600;
    line-height:1.3;
    color:var(--text);
    text-align:center;
  }

  .cert-item-actions{
    display:flex;
    gap:6px;
    padding:0 8px 10px;
  }
  .cert-item-actions .btn-mini{
    flex:1;
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:0 6px;
    border-radius:10px;
    border:none;
    font-family:inherit;
    font-size:11.5px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .cert-item-actions .btn-mini svg{ width:13px; height:13px; }
  .cert-item-actions .btn-mini:active{ transform:scale(.96); opacity:.9; }
  .cert-item-actions .btn-mini.outline{ background:var(--fill); color:var(--blue); }
  .cert-item-actions .btn-mini.solid{ background:var(--blue); color:#fff; }

  /* videos inside a category */
  .cert-section-title{
    grid-column:1 / -1;
    font-size:13px;
    font-weight:700;
    color:var(--secondary);
    margin:6px 4px 0;
  }
  .cert-video-thumb{
    position:relative;
    display:block;
    width:100%;
    padding:0;
    border:0;
    background:none;
    cursor:pointer;
    font:inherit;
    text-align:start;
  }
  .cert-video-thumb .video-poster{
    width:100%;
    height:108px;
    display:block;
    object-fit:cover;
    background:var(--fill);
    opacity:0;
    transition:opacity .25s ease;
  }
  .cert-video-thumb .video-poster.loaded{ opacity:1; }
  .cert-video-thumb div.video-poster{ opacity:1; }
  .video-play{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:108px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .video-play svg{
    width:44px;
    height:44px;
    padding:11px;
    border-radius:50%;
    background:rgba(0,0,0,.58);
    color:#fff;
    box-sizing:border-box;
  }
  .video-wrap{
    width:min(92vw, 880px);
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .video-wrap iframe,
  .video-wrap video{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  /* ---------- 12. PROJECT DETAIL ---------- */
  .project-detail{
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:18px 16px;
    margin-bottom:16px;
    text-align:center;
  }
  .project-detail p{
    margin:0;
    font-size:13.5px;
    font-weight:600;
    line-height:1.7;
    color:var(--secondary);
  }
  .project-detail .card{
    margin:14px 0 0;
    background:var(--field);
    box-shadow:none;
    border:none;
    border-radius:12px;
    overflow:hidden;
    text-align:start;
  }

  .project-detail .file-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
  }
  .project-detail .file-row .row-icon{ --tile:#ff3b30; }
  .project-detail .file-title{
    flex:1;
    min-width:0;
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
    text-align:start;
    line-height:1.45;
    word-break:break-word;
  }
  .project-detail .file-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .project-detail .file-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    border-radius:10px;
    border:none;
    text-decoration:none;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .project-detail .file-btn svg{ width:16px; height:16px; }
  .project-detail .file-btn.view{ background:var(--card); color:var(--blue); }
  .project-detail .file-btn.download{ background:var(--blue); color:#fff; }
  .project-detail .file-btn:active{ transform:scale(.94); }

  /* ---------- 13. LIGHTBOXES ---------- */
  .lightbox-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    padding:24px;
    transition:background .25s ease, opacity .25s ease;
  }
  .lightbox-backdrop.open{
    background:rgba(0,0,0,.86);
    opacity:1;
    pointer-events:auto;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .lightbox-content{
    max-width:100%;
    max-height:80vh;
    border-radius:12px;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
    display:block;
  }
  .lightbox-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:100%;
  }
  .lightbox-caption{
    color:#fff;
    text-align:center;
    font-size:14px;
    font-weight:600;
    line-height:1.5;
    margin-top:12px;
    opacity:.92;
  }

  .lightbox-close{
    position:fixed;
    top:18px;
    right:18px;
    left:auto;
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    color:#fff;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:201;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:transform .12s ease, background .2s ease;
  }
  .lightbox-close svg{ width:17px; height:17px; }
  .lightbox-close:active{ transform:scale(.92); }

  .lightbox-back{
    position:fixed;
    top:18px;
    left:18px;
    right:auto;
    display:none;
    align-items:center;
    gap:7px;
    padding:10px 16px;
    border-radius:20px;
    background:rgba(255,255,255,.16);
    color:#fff;
    border:none;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    z-index:201;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:background .15s ease, transform .12s ease;
  }
  .lightbox-back svg{ width:14px; height:14px; }
  .lightbox-back:active{ transform:scale(.95); background:rgba(255,255,255,.28); }

  .lightbox-share{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:40px;
    margin-top:14px;
    padding:0 18px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,.16);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:transform .12s ease, background .2s ease;
  }
  .lightbox-share svg{ width:14px; height:14px; }
  .lightbox-share:active{ transform:scale(.95); }

  html[dir="rtl"] .lightbox-close{ right:auto; left:18px; }
  html[dir="rtl"] .lightbox-back{ left:auto; right:18px; }

  /* ---------- 14. SHEETS ---------- */
  .sheet-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:background .28s ease, opacity .28s ease;
  }
  .sheet-backdrop.open{
    background:rgba(0,0,0,.35);
    opacity:1;
    pointer-events:auto;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .sheet{
    width:100%;
    max-width:460px;
    margin:0 12px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(110%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }

  .sheet-group{
    background:var(--sheet-bg);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:8px;
    text-align:center;
    box-shadow:var(--shadow);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  .sheet-title{
    padding:14px 16px 12px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--secondary);
    box-shadow:inset 0 -1px 0 var(--separator);
  }
  html[dir="rtl"] .sheet-title{ letter-spacing:0; text-transform:none; }

  .sheet-option{
    display:block;
    width:100%;
    padding:15px 16px;
    background:none;
    border:none;
    font-family:inherit;
    font-size:16.5px;
    font-weight:600;
    color:var(--blue);
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  .sheet-option + .sheet-option{ box-shadow:inset 0 1px 0 var(--separator); }
  .sheet-option:active{ background:var(--fill-2); }

  .sheet-cancel{
    display:block;
    width:100%;
    padding:15px 16px;
    background:var(--sheet-bg);
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-size:16.5px;
    font-weight:700;
    color:var(--blue);
    cursor:pointer;
    box-shadow:var(--shadow);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    transition:background .15s ease, transform .12s ease;
  }
  .sheet-cancel:active{ transform:scale(.99); background:var(--fill); }

  /* QR sheet: segmented control + code */
  .qr-tabs{
    display:flex;
    gap:2px;
    padding:3px;
    border-radius:11px;
    background:var(--fill);
    margin-bottom:12px;
  }
  .qr-tab{
    flex:1;
    min-height:40px;
    padding:10px 4px;
    border:none;
    border-radius:9px;
    background:transparent;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--secondary);
    cursor:pointer;
    white-space:nowrap;
    transition:background .24s cubic-bezier(.4,.1,.2,1), color .2s ease;
  }
  .qr-tab.active{
    background:var(--blue);
    color:#fff;
    font-weight:800;
    box-shadow:0 3px 10px rgba(0,122,255,.38);
  }
  .qr-box{
    background:#fff;
    border-radius:12px;
    padding:14px;
    display:flex;
    justify-content:center;
    margin:0;
  }
  .qr-box img{ width:190px; height:190px; display:block; }

  /* ---------- 15. TOAST ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 14px);
    z-index:250;
    max-width:86vw;
    padding:12px 20px;
    border-radius:22px;
    background:rgba(30,30,32,.92);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    line-height:1.4;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- 16. SKELETON LOADING ---------- */
  .cert-skeleton-item{
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .cert-skeleton-item .cert-skeleton-img{
    height:108px;
    background:linear-gradient(90deg, var(--fill) 25%, var(--fill-2) 37%, var(--fill) 63%);
    background-size:400% 100%;
    animation:skeleton-shimmer 1.4s ease infinite;
  }
  .cert-skeleton-item .cert-skeleton-label{
    height:12px;
    margin:10px 14px 12px;
    border-radius:6px;
    background:linear-gradient(90deg, var(--fill) 25%, var(--fill-2) 37%, var(--fill) 63%);
    background-size:400% 100%;
    animation:skeleton-shimmer 1.4s ease infinite;
  }
  @keyframes skeleton-shimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }
  .cert-loading-text{
    display:none;
    text-align:center;
    color:var(--secondary);
    font-size:13px;
    font-weight:600;
    margin:-4px 0 14px;
  }

  /* ---------- 17. RESPONSIVE ---------- */
  @media (hover:hover){
    .row:hover{ background:var(--fill); }
    .btn:hover{ opacity:.95; }
    .quick-action:hover,
    .cert-category-item:hover,
    .cert-item:hover{ background:var(--card); }
    .sheet-option:hover{ background:var(--fill); }
    .cert-overlay-back:hover{ background:var(--card); }
    .lightbox-close:hover,
    .lightbox-back:hover,
    .lightbox-share:hover{ background:rgba(255,255,255,.26); }
  }

  @media (max-width:480px){
    .profile-pic{ width:126px; height:126px; }
    .avatar-fb svg{ width:48px; height:48px; }
    .cert-item img{ height:96px; }
    .cert-video-thumb .video-poster,
    .video-play{ height:96px; }
    .cv-viewer.open{ max-height:440px; }
    .cv-viewer iframe{ height:420px; }
  }

  @media (max-width:380px){
    .lang-toggle{ font-size:12.5px; padding:0 12px; }
    .quick-action{ padding:12px 4px; }
    .quick-action span{ font-size:11px; }
    .qr-tab{ font-size:12.5px; }
    .cert-overlay-title{ font-size:15.5px; }
  }

  @media (min-width:780px){
    body{ padding:64px 24px 56px; }
    .profile-pic{ width:148px; height:148px; }
    .avatar-fb svg{ width:56px; height:56px; }
    .container{ max-width:400px; }
    .cert-overlay-body{ max-width:400px; }
  }

  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }
  </style>

    // أسماء الأقسام/المشاريع اللي بتيجي من ملفات JSON وليها ترجمة.
    // أي اسم مش موجود هنا بيظهر زي ما هو في ملف JSON.
    const NAME_MAP = {
      'Other': { en: 'Other', ar: 'أخرى' },
      'دورات تدريبية': { en: 'Training Courses', ar: 'دورات تدريبية' }
    };

    let lang = 'en'; // الافتراضي: الإنجليزية
    try {
      // الإنجليزية دايمًا هي الافتراضي. الوحيد اللي بيغيّرها لينك فيه ?lang=ar
      const savedLang = new URLSearchParams(window.location.search).get('lang');
      if (savedLang === 'ar' || savedLang === 'en') lang = savedLang;
    } catch (_) {}

    function t(key, ...args){
      let v = I18N[lang][key];
      if (v === undefined) v = I18N.en[key];
      return typeof v === 'function' ? v(...args) : v;
    }
    function displayName(n){
      const m = NAME_MAP[n];
      return m ? m[lang] : n;
    }
    // عنوان عنصر من JSON: title_en / title_ar لو موجودين، وإلا title العادي
    function itemTitle(item, fallback = ''){
      return item['title_' + lang] || item.title || item.name || fallback;
    }

    // ===================== Typing effect =====================
    const typingEl = document.getElementById('typing');
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function tick() {
      const texts = t('typing');
      const current = texts[textIndex % texts.length];
      if (!isDeleting) {
        charIndex++;
        typingEl.textContent = current.slice(0, charIndex);
      } else {
        charIndex--;
        typingEl.textContent = current.slice(0, charIndex);
      }

      let delay = isDeleting ? 55 : 110;

      if (!isDeleting && charIndex >= current.length) {
        delay = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex <= 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        delay = 300;
      }
      setTimeout(tick, delay);
    }
    tick();

    // ===================== Icons (inline SVG sprite) =====================
    // كل الأيقونات بتيجي من سبرايت SVG واحد في أول الصفحة — مفيش خطوط أيقونات خارجية.
    const ICON_MAP = {
      'globe': 'globe', 'moon': 'moon', 'sun': 'sun', 'copy': 'copy', 'address-card': 'contact',
      'share-nodes': 'share', 'qrcode': 'qr', 'whatsapp': 'whatsapp', 'phone': 'phone',
      'envelope': 'mail', 'linkedin-in': 'linkedin', 'facebook-f': 'facebook', 'youtube': 'youtube',
      'telegram-plane': 'telegram', 'certificate': 'cert', 'diagram-project': 'projects',
      'calculator': 'calc', 'eye': 'eye', 'eye-slash': 'eye-off', 'file-download': 'download',
      'arrow-right': 'arrow-right', 'xmark': 'close', 'chevron-right': 'chevron', 'cube': 'cube',
      'fan': 'fan', 'briefcase': 'briefcase', 'folder': 'folder', 'play': 'play', 'gear': 'gear',
      'drafting-compass': 'compass', 'droplet': 'droplet', 'file-pdf': 'file', 'file': 'file'
    };
    function svgIcon(id, cls){
      return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' aria-hidden="true" focusable="false"><use href="#i-' + id + '"/></svg>';
    }
    // بياخد اسم أيقونة فونت أوسم (fa-cube مثلاً) ويرجّع نفس الأيقونة كـ SVG داخلي
    function faIcon(name, cls){
      const raw = String(name || '').trim().split(/\s+/).pop() || '';
      return svgIcon(ICON_MAP[raw.replace(/^fa-/, '')] || 'folder', cls);
    }

    function backBtnHtml(label){
      return svgIcon('arrow-right', 'back-arrow') + ' ' + escapeHtml(label);
    }

    // View CV toggle (inline viewer على الديسكتوب، تاب جديد على الموبايل)
    const viewCvBtn = document.getElementById('viewCvBtn');
    const cvViewer = document.getElementById('cvViewer');
    const cvFrame = document.getElementById('cvFrame');
    let cvLoaded = false;

    // متصفحات الموبايل (خصوصًا كروم أندرويد) مش بتعرف تعرض PDF جوه iframe —
    // بتظهر كارت "فتح" بدل المعاينة. الحل: افتح الملف في تاب جديد بدل الـ iframe.
    const isMobileBrowser = window.matchMedia('(pointer: coarse)').matches;

    function updateCvBtn(){
      const isOpen = cvViewer.classList.contains('open');
      viewCvBtn.innerHTML = `${svgIcon(isOpen ? 'eye-off' : 'eye')} ${escapeHtml(t(isOpen ? 'hideCv' : 'viewCv'))}`;
    }

    viewCvBtn.addEventListener('click', () => {
      if (isMobileBrowser) {
        window.open('cv-viewer.html?v=' + Date.now(), '_blank');
        return;
      }
      const isOpen = cvViewer.classList.toggle('open');
      if (isOpen) {
        if (!cvLoaded) {
          cvFrame.src = 'cv.pdf';
          cvLoaded = true;
        }
        cvViewer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      updateCvBtn();
    });

    // Telegram action sheet
    const telegramBtn = document.getElementById('telegramBtn');
    const telegramSheet = document.getElementById('telegramSheet');
    const telegramSheetCancel = document.getElementById('telegramSheetCancel');

    function openTelegramSheet(){
      telegramSheet.classList.add('open');

    function closeTelegramSheet(){
      telegramSheet.classList.remove('open');
    }

    telegramBtn.addEventListener('click', openTelegramSheet);
    telegramSheetCancel.addEventListener('click', closeTelegramSheet);
    telegramSheet.addEventListener('click', (e) => {
      if (e.target === telegramSheet) closeTelegramSheet();
    });

    // Profile picture lightbox (مع زر رجوع للصفحة الرئيسية)
    const profilePicBtn = document.getElementById('profilePicBtn');
    const profileLightbox = document.getElementById('profileLightbox');
    const profileLightboxBack = document.getElementById('profileLightboxBack');

    function openProfileLightbox(){
      profileLightbox.classList.add('open');
      profileLightboxBack.style.display = 'flex';
    }
    function closeProfileLightbox(){
      profileLightbox.classList.remove('open');
      profileLightboxBack.style.display = 'none';
    }

    profilePicBtn.addEventListener('click', openProfileLightbox);
    profileLightboxBack.addEventListener('click', closeProfileLightbox);
    profileLightbox.addEventListener('click', (e) => {
      if (e.target === profileLightbox) closeProfileLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && profileLightbox.classList.contains('open')) closeProfileLightbox();
    });

    // Certificates overlay open/close
    const certificatesBtn = document.getElementById('certificatesBtn');
    const certificatesOverlay = document.getElementById('certificatesOverlay');
    const certificatesOverlayBack = document.getElementById('certificatesOverlayBack');
    const certOverlayTitle = document.getElementById('certOverlayTitle');
    const certCountEl = document.getElementById('certCount');
    const certSkeletonGrid = document.getElementById('certSkeletonGrid');
    const certCategoryGrid = document.getElementById('certCategoryGrid');
    const certLoadingText = document.getElementById('certLoadingText');

    // كل قسم (category) بياخد أيقونة ولون مميز. عايز تضيف قسم جديد؟
    // زوّد سطر هنا بنفس اسم "category" اللي هتكتبه في certificates.json
    const categoryMeta = {
      // logo (اختياري): مسار صورة اللوجو. لو الصورة مش موجودة بيرجع للأيقونة تلقائيًا.
      'SOLIDWORKS': { icon: 'fa-cube', color: '#D0342C', logo: 'certificates/logos/solidworks.png' },
      'HVAC': { icon: 'fa-fan', color: '#0A84FF' },
      'دورات تدريبية': { icon: 'fa-briefcase', color: '#5856D6' }
    };
    function metaFor(cat){
      return categoryMeta[cat] || { icon: 'fa-folder', color: '#8E8E93' };
    }
    // أيقونة القسم: لوجو لو متحدد (وبيرجع للأيقونة لو الصورة فشلت)
    function categoryIconHtml(name, meta){
      const glyph = faIcon(meta.icon);
      const fallback = `<span class="cert-category-icon" style="--tile:${meta.color}">${glyph}</span>`;
      if (meta.logo) {
        return `<span class="cert-category-icon has-logo" style="--tile:${meta.color}" data-fb="${escapeHtml(fallback)}"><img src="${escapeHtml(meta.logo)}" alt="${escapeHtml(name)}" onerror="this.parentNode.classList.remove('has-logo');this.parentNode.innerHTML=this.parentNode.getAttribute('data-fb')"></span>`;
      }
      return `<span class="cert-category-icon" style="--tile:${meta.color}">${glyph}</span>`;
    }

    let currentCategory = null; // null = شاشة الأقسام الرئيسية
    let currentSub = null;      // null أو 'videos' (مجلد الفيديوهات جوه القسم)

    // Deep links: #certifications أو #certifications/HVAC
    function setCertificatesHash(category = null, sub = null){
      const nextHash = category
        ? '#certifications/' + encodeURIComponent(category) + (sub ? '/' + encodeURIComponent(sub) : '')
        : '#certifications';
      if (window.location.hash !== nextHash) window.location.hash = nextHash;
    }

    function openCertificatesOverlay(updateHash = true){
      certificatesOverlay.classList.add('open');
      certificatesOverlay.scrollTop = 0;
      currentCategory = null;
      if (updateHash && !window.location.hash.toLowerCase().startsWith('#certifications')) {
        setCertificatesHash();
      }
      // لو البيانات لسه ما وصلتش، اعرض حالة التحميل بدل شاشة فاضية
      if (certificatesState === 'loading') {
        showCertSkeleton();
      } else if (certificatesState === 'ready') {
        renderCategories(certificatesData);
      }
    }
    function closeCertificatesOverlay(updateHash = true){
      certificatesOverlay.classList.remove('open');
      if (updateHash && window.location.hash.toLowerCase().startsWith('#certifications')) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    function syncCertificatesFromHash(){
      const hash = window.location.hash || '';
      if (!hash.toLowerCase().startsWith('#certifications')) {
        if (certificatesOverlay.classList.contains('open')) closeCertificatesOverlay(false);
        return;
      }
      openCertificatesOverlay(false);
      if (certificatesState !== 'ready') return;
      const rawParts = hash.slice('#certifications'.length).replace(/^\//, '').split('/');
      const rawCategory = rawParts[0];
      let subPart = rawParts[1] || null;
      try { if (subPart) subPart = decodeURIComponent(subPart); } catch (_) {}
      if (rawCategory) {
        let category = rawCategory;
        try { category = decodeURIComponent(rawCategory); } catch (_) {}
        const categories = groupByCategory(certificatesData);
        if (Object.prototype.hasOwnProperty.call(categories, category)) {
          openCategory(category, false, subPart);
        } else {
          renderCategories(certificatesData);
        }
      } else {
        renderCategories(certificatesData);
      }
    }

    certificatesBtn.addEventListener('click', () => {
      if (window.location.hash.toLowerCase().startsWith('#certifications')) {
        syncCertificatesFromHash();
      } else {
        setCertificatesHash();
        openCertificatesOverlay(false);
      }
    });
    window.addEventListener('hashchange', syncCertificatesFromHash);
    certificatesOverlayBack.addEventListener('click', () => {
      // لو داخل قسم معيّن: ارجع لقائمة الأقسام. لو في قائمة الأقسام: اقفل الشاشة كلها.
      if (currentCategory && currentSub) {
        openCategory(currentCategory, true); // من مجلد الفيديوهات لصفحة القسم
      } else if (currentCategory) {
        setCertificatesHash();
        renderCategories(certificatesData);
      } else {
        closeCertificatesOverlay(true);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && certificatesOverlay.classList.contains('open')) closeCertificatesOverlay();
    });

    // ===== Projects =====
    // بيانات المشاريع بتتحمّل تلقائي من ملف projects.json (نفس مجلد الصفحة، زي certificates.json).
    // كل عنصر في الملف: { "title": "اسم الملف", "category": "اسم المشروع", "pdf": "مسار الـ PDF" }
    // عايز تضيف/تشيل ملف؟ عدّل projects.json بس.
    // عايز مشروع جديد يظهر حتى قبل ما تضيفله ملفات، أو تغيّر أيقونته/لونه؟ زوّد سطر في projectMeta.
    const projectMeta = {
      // logo (اختياري): مسار صورة اللوجو. لو الصورة مش موجودة بيرجع للأيقونة تلقائيًا.
      'Revit': { icon: 'fa-gear', color: '#FF9500', logo: 'projects/logos/revit.png' },
      'AutoCad': { icon: 'fa-drafting-compass', color: '#E5322D', logo: 'projects/logos/autocad.png' }
    };
    function projectMetaFor(name){
      return projectMeta[name] || { icon: 'fa-folder', color: '#8E8E93' };
    }

    const projectsBtn = document.getElementById('projectsBtn');
    const projectsOverlay = document.getElementById('projectsOverlay');
    const projectsOverlayBack = document.getElementById('projectsOverlayBack');
    const projectsOverlayTitle = document.getElementById('projectsOverlayTitle');
    const projectsGrid = document.getElementById('projectsGrid');
    const projectDetail = document.getElementById('projectDetail');
    let currentProject = null;
    let currentSection = null;
    let projectsState = 'loading'; // loading | ready | error
    let projectsData = [];

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function projectOf(item){
      return item.category || item.project || 'Other';
    }
    // القسم الفرعي (اختياري) جوه المشروع: حقل "section" في projects.json
    function sectionOf(item){
      return item.section || item.subcategory || '';
    }
    function projectFiles(name){
      return projectsData.filter((f) => projectOf(f) === name && (f.pdf || f.file));
    }
    function sectionNames(name){
      const names = [];
      projectFiles(name).forEach((f) => {
        const s = sectionOf(f);
        if (s && !names.includes(s)) names.push(s);
      });
      return names;
    }
    // أسماء المشاريع: اللي في projectMeta (بالترتيب) + أي مشروع جديد ظهر في projects.json
    function projectNames(){
      const names = Object.keys(projectMeta);
      projectsData.forEach((f) => {
        const n = projectOf(f);
        if (!names.includes(n)) names.push(n);
      });
      return names;
    }

    // رابط المعاينة: على الموبايل بنفتح الملف في عارض PDF.js (متصفحات الموبايل بتحمّل الـ PDF بدل ما تعرضه)
    function viewHref(pdf){
      if (!isMobileBrowser) return pdf;
      try {
        const abs = new URL(pdf, window.location.href).href;
        return 'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(abs);
      } catch (_) {
        return pdf;
      }
    }

    function fileRowsHtml(files){
      return '<div class="card">' + files.map((f) => {
        const pdf = f.pdf || f.file;
        const title = itemTitle(f, pdf);
        return `
      <div class="row file-row">
        <span class="row-icon">${svgIcon('file')}</span>
        <span class="file-title">${escapeHtml(title)}</span>
        <span class="file-actions">
          <a class="file-btn view" href="${escapeHtml(viewHref(pdf))}" target="_blank" rel="noopener" aria-label="${escapeHtml(t('preview'))}">${svgIcon('eye')}</a>
          <a class="file-btn download" href="${escapeHtml(pdf)}" download aria-label="${escapeHtml(t('download'))}">${svgIcon('download')}</a>
        </span>
      </div>`;
      }).join('') + '</div>';
    }

    function renderProjects(){
      currentProject = null;
      currentSection = null;
      projectsOverlayTitle.textContent = t('projects');
      projectsOverlayBack.innerHTML = backBtnHtml(t('back'));
      projectDetail.style.display = 'none';
      projectsGrid.innerHTML = projectNames().map((name) => {
        const meta = projectMetaFor(name);
        const label = displayName(name);
        const count = projectsState === 'ready' ? projectFiles(name).length : null;
        const glyph = faIcon(meta.icon);
        const fallback = `<span class="cert-category-icon" style="--tile:${meta.color}">${glyph}</span>`;
        const iconHtml = meta.logo
          ? `<span class="cert-category-icon has-logo" style="--tile:${meta.color}" data-fb="${escapeHtml(fallback)}"><img src="${escapeHtml(meta.logo)}" alt="${escapeHtml(label)}" onerror="this.parentNode.classList.remove('has-logo');this.parentNode.innerHTML=this.parentNode.getAttribute('data-fb')"></span>`
          : fallback;
        return `
        <button type="button" class="cert-category-item" data-project="${escapeHtml(name)}">
          ${iconHtml}
          <span class="cert-category-label">${escapeHtml(label)}</span>
          ${count === null ? '' : `<span class="cert-category-count">${escapeHtml(t('fileCount', count))}</span>`}
        </button>`;
      }).join('');
      projectsGrid.style.display = 'grid';
      projectsOverlay.scrollTop = 0;
    }

    // يفتح مشروع (وقسم فرعي جواه لو section اتحدد)
    function openProject(name, section = null, updateHash = true){
      if (!projectNames().includes(name)) { renderProjects(); return; }
      if (section && projectsState === 'ready' && !sectionNames(name).includes(section)) section = null;
      currentProject = name;
      currentSection = section || null;
      if (updateHash) setProjectsHash(name, currentSection);
      const meta = projectMetaFor(name);

      projectsOverlayTitle.textContent = displayName(currentSection || name);
      projectsOverlayBack.innerHTML = backBtnHtml(currentSection ? displayName(name) : t('sections'));

      projectsGrid.innerHTML = '';
      projectsGrid.style.display = 'none';
      let html = '';

      if (projectsState === 'loading') {
        html = '<p>' + escapeHtml(t('projLoading')) + '</p>';
      } else if (projectsState === 'error') {
        html = '<p>' + escapeHtml(t('projError')) + '</p>';
      } else if (currentSection) {
        // جوه قسم فرعي: ملفاته بس
        const files = projectFiles(name).filter((f) => sectionOf(f) === currentSection);
        html = files.length
          ? fileRowsHtml(files)
          : `<p>${escapeHtml(t('projSoon', displayName(currentSection)))}</p>`;
      } else {
        // صفحة المشروع: الأقسام الفرعية كأيقونات + الملفات اللي من غير قسم
        const all = projectFiles(name);
        const sections = sectionNames(name);
        const direct = all.filter((f) => !sectionOf(f));
        if (sections.length) {
          projectsGrid.innerHTML = sections.map((s) => {
            const count = all.filter((f) => sectionOf(f) === s).length;
            return `
        <button type="button" class="cert-category-item" data-section="${escapeHtml(s)}">
          <span class="cert-category-icon" style="--tile:${meta.color}">${svgIcon('folder')}</span>
          <span class="cert-category-label">${escapeHtml(displayName(s))}</span>
          <span class="cert-category-count">${escapeHtml(t('fileCount', count))}</span>
        </button>`;
          }).join('');
          projectsGrid.style.display = 'grid';
        }
        if (direct.length) {
          html = fileRowsHtml(direct);
        } else if (!sections.length) {
          html = `<p>${escapeHtml(t('projSoon', displayName(name)))}</p>`;
        }
      }

      if (html) {
        projectDetail.innerHTML = html;
        projectDetail.style.display = 'block';
      } else {
        projectDetail.innerHTML = '';
        projectDetail.style.display = 'none';
      }
      projectsOverlay.scrollTop = 0;
    }

    // الروابط: #projects أو #projects/Revit أو #projects/Revit/اسم القسم
    function setProjectsHash(name = null, section = null){
      let nextHash = '#projects';
      if (name) nextHash += '/' + encodeURIComponent(name);
      if (name && section) nextHash += '/' + encodeURIComponent(section);
      if (window.location.hash !== nextHash) window.location.hash = nextHash;
    }

    function openProjectsOverlay(){
      projectsOverlay.classList.add('open');
      renderProjects();
    }
    function closeProjectsOverlay(updateHash = true){
      projectsOverlay.classList.remove('open');
      if (updateHash && window.location.hash.toLowerCase().startsWith('#projects')) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    function syncProjectsFromHash(){
      const hash = window.location.hash || '';
      if (!hash.toLowerCase().startsWith('#projects')) {
        if (projectsOverlay.classList.contains('open')) closeProjectsOverlay(false);
        return;
      }
      projectsOverlay.classList.add('open');
      const raw = hash.slice('#projects'.length).replace(/^\//, '');
      if (raw) {
        const parts = raw.split('/').map((p) => {
          try { return decodeURIComponent(p); } catch (_) { return p; }
        });
        openProject(parts[0], parts[1] || null, false);
      } else {
        renderProjects();
      }
    }

    projectsBtn.addEventListener('click', () => {
      setProjectsHash();
      openProjectsOverlay();
    });
    projectsGrid.addEventListener('click', (e) => {
      const sec = e.target.closest('[data-section]');
      if (sec && currentProject) {
        openProject(currentProject, sec.getAttribute('data-section'));
        return;
      }
      const btn = e.target.closest('[data-project]');
      if (btn) openProject(btn.getAttribute('data-project'));
    });
    projectsOverlayBack.addEventListener('click', () => {
      if (currentSection) {
        openProject(currentProject);
      } else if (currentProject) {
        setProjectsHash();
        renderProjects();
      } else {
        closeProjectsOverlay(true);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && projectsOverlay.classList.contains('open')) closeProjectsOverlay();
    });
    window.addEventListener('hashchange', syncProjectsFromHash);

    // تحميل projects.json
    function refreshProjectsView(){
      if (!projectsOverlay.classList.contains('open')) return;
      if (currentProject) openProject(currentProject, currentSection, false);
      else renderProjects();
    }
    fetch('projects.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('projects.json not found');
        return res.json();
      })
      .then((data) => {
        projectsState = 'ready';
        // أي عنصر فيه "hidden": true بيتخفي من الصفحة (من غير ما تمسحه من الملف)
        projectsData = Array.isArray(data) ? data.filter((f) => f && !f.hidden) : [];
        refreshProjectsView();
      })
      .catch(() => {
        projectsState = 'error';
        refreshProjectsView();
      });

    if (window.location.hash.toLowerCase().startsWith('#projects')) syncProjectsFromHash();

    // ===== Calculations =====
    // قائمة الحاسبات بتتحمّل من calculations.json (نفس مجلد الصفحة).
    // كل عنصر: { "title_en":"..", "title_ar":"..", "subtitle_en":"..", "subtitle_ar":"..",
    //            "icon":"fa-droplet", "color":"#0A84FF", "url":"calculators/اسم-الملف.html" }
    // لو الملف مش موجود، بتظهر القائمة الافتراضية دي.
    const DEFAULT_CALCS = [
      {
        title_en: 'Sprinkler Pipe Size',
        title_ar: 'أقطار مواسير الرشاشات',
        subtitle_en: 'Fire Fighting',
        subtitle_ar: 'مكافحة الحريق',
        icon: 'fa-droplet',
        color: '#0A84FF',
        url: 'calculators/sprinkler/'
      }
    ];
    let calcData = DEFAULT_CALCS;

    const calcBtn = document.getElementById('calcBtn');
    const calcOverlay = document.getElementById('calcOverlay');
    const calcOverlayBack = document.getElementById('calcOverlayBack');
    const calcGrid = document.getElementById('calcGrid');
    const calcEmpty = document.getElementById('calcEmpty');
    const calcCountEl = document.getElementById('calcCount');

    // الحاسبات المحلية بتاخد اللغة الحالية للموقع معاها
    function calcHref(url){
      if (/^https?:/i.test(url)) return url;
      return url + (url.indexOf('?') === -1 ? '?' : '&') + 'lang=' + lang;
    }

    function renderCalcs(){
      calcCountEl.textContent = calcData.length ? '(' + calcData.length + ')' : '';
      if (!calcData.length) {
        calcGrid.innerHTML = '';
        calcGrid.style.display = 'none';
        calcEmpty.style.display = 'block';
        return;
      }
      calcEmpty.style.display = 'none';
      calcGrid.innerHTML = calcData.map((c) => {
        const title = itemTitle(c, c.url);
        const sub = c['subtitle_' + lang] || c.subtitle || '';
        const color = c.color || '#8E8E93';
        const icon = c.icon || 'fa-calculator';
        return `
        <a class="cert-category-item" href="${escapeHtml(calcHref(c.url))}">
          <span class="cert-category-icon" style="--tile:${escapeHtml(color)}">${faIcon(icon)}</span>
          <span class="cert-category-label">${escapeHtml(title)}</span>
          ${sub ? `<span class="cert-category-count">${escapeHtml(sub)}</span>` : ''}
        </a>`;
      }).join('');
      calcGrid.style.display = 'grid';
    }

    function openCalcOverlay(){
      calcOverlay.classList.add('open');
      calcOverlay.scrollTop = 0;
      renderCalcs();
    }
    function closeCalcOverlay(updateHash = true){
      calcOverlay.classList.remove('open');
      if (updateHash && window.location.hash.toLowerCase() === '#calculations') {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }
    // الرابط: #calculations (الرجوع من صفحة حاسبة بيفتح القسم تلقائيًا)
    function syncCalcFromHash(){
      if ((window.location.hash || '').toLowerCase() === '#calculations') {
        openCalcOverlay();
      } else if (calcOverlay.classList.contains('open')) {
        closeCalcOverlay(false);
      }
    }

    calcBtn.addEventListener('click', () => {
      if (window.location.hash.toLowerCase() !== '#calculations') window.location.hash = '#calculations';
      openCalcOverlay();
    });
    calcOverlayBack.addEventListener('click', () => closeCalcOverlay(true));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && calcOverlay.classList.contains('open')) closeCalcOverlay();
    });
    window.addEventListener('hashchange', syncCalcFromHash);

    fetch('calculations.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('calculations.json not found');
        return res.json();
      })
      .then((data) => {
        // أي عنصر فيه "hidden": true بيتخفي من الصفحة
        if (Array.isArray(data)) calcData = data.filter((c) => c && c.url && !c.hidden);
        renderCalcs();
      })
      .catch(() => { renderCalcs(); });

    syncCalcFromHash();

    // Certificates: loaded dynamically from certificates.json
    const certGrid = document.getElementById('certGrid');
    const certEmpty = document.getElementById('certEmpty');
    const certLightbox = document.getElementById('certLightbox');
    const certLightboxImg = document.getElementById('certLightboxImg');
    const certLightboxCaption = document.getElementById('certLightboxCaption');
    const certLightboxClose = document.getElementById('certLightboxClose');
    const certLightboxShare = document.getElementById('certLightboxShare');
    let certificatesState = 'loading'; // loading | ready | error
    let certificatesData = [];

    function showCertSkeleton(){
      certLoadingText.style.display = 'block';
      certSkeletonGrid.style.display = 'grid';
      certCategoryGrid.style.display = 'none';
      certGrid.style.display = 'none';
      certEmpty.style.display = 'none';
      if (!certSkeletonGrid.childElementCount) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 6; i++) {
          const item = document.createElement('div');
          item.className = 'cert-skeleton-item';
          item.innerHTML = '<div class="cert-skeleton-img"></div><div class="cert-skeleton-label"></div>';
          frag.appendChild(item);
        }
        certSkeletonGrid.appendChild(frag);
      }
    }
    function hideCertSkeleton(){
      certLoadingText.style.display = 'none';
      certSkeletonGrid.style.display = 'none';
    }

    function groupByCategory(list){
      const map = {};
      list.forEach((c) => {
        const cat = c.category || 'Other';
        if (!map[cat]) map[cat] = [];
        map[cat].push(c);
      });
      return map;
    }

    // شاشة الأقسام (الصفحة الرئيسية لل Certifications): كل قسم أيقونة واحدة
    function renderCategories(list){
      currentCategory = null;
      certOverlayTitle.textContent = t('certifications');
      currentSub = null;
      certificatesOverlayBack.innerHTML = backBtnHtml(t('back'));
      certGrid.style.display = 'none';
      certCategoryGrid.innerHTML = '';

      const grouped = groupByCategory(list);
      const cats = Object.keys(grouped);
      hideCertSkeleton();

      if (cats.length === 0) {
        certCategoryGrid.style.display = 'none';
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
        return;
      }

      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${list.length})`;
      const frag = document.createDocumentFragment();
      cats.forEach((cat) => {
        const meta = metaFor(cat);
        const label = displayName(cat);
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'cert-category-item';
        item.setAttribute('data-category', cat);
        item.innerHTML = `
          ${categoryIconHtml(label, meta)}
          <span class="cert-category-label">${escapeHtml(label)}</span>
          <span class="cert-category-count">${escapeHtml(t('certCountLabel', grouped[cat].filter((c) => !isVideoItem(c)).length, grouped[cat].filter(isVideoItem).length))}</span>
        `;
        frag.appendChild(item);
      });
      certCategoryGrid.appendChild(frag);
      certCategoryGrid.style.display = 'grid';
    }

    certCategoryGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('.cert-category-item');
      if (!btn) return;
      const cat = btn.getAttribute('data-category');
      openCategory(cat);
    });

    // فتح قسم معيّن: يعرض بس الشهادات اللي جواه
    function openCategory(cat, updateHash = true, sub = null){
      currentCategory = cat;
      certCategoryGrid.style.display = 'none';
      const items = groupByCategory(certificatesData)[cat] || [];
      const videos = items.filter(isVideoItem);
      const certs = items.filter((c) => !isVideoItem(c));
      if (sub !== 'videos' || videos.length === 0) sub = null;
      currentSub = sub;
      if (updateHash) setCertificatesHash(cat, sub);
      if (sub === 'videos') {
        // مجلد الفيديوهات: فيديوهات بس، من غير شهادات
        certOverlayTitle.textContent = t('videosHeading');
        certificatesOverlayBack.innerHTML = backBtnHtml(displayName(cat));
        renderVideos(videos);
      } else {
        certOverlayTitle.textContent = displayName(cat);
        certificatesOverlayBack.innerHTML = backBtnHtml(t('sections'));
        renderCertificates(certs, videos.length);
      }
      certificatesOverlay.scrollTop = 0;
    }

    function openCertLightbox(fullSrc, caption){
      certLightboxImg.src = fullSrc;
      certLightboxCaption.textContent = caption || '';
      certLightbox.classList.add('open');
      certLightboxClose.style.display = 'flex';
    }
    function closeCertLightbox(){
      certLightbox.classList.remove('open');
      certLightboxClose.style.display = 'none';
      certLightboxImg.src = '';
    }

    certGrid.addEventListener('click', (e) => {
      // مجلد الفيديوهات جوه القسم
      const folderBtn = e.target.closest('[data-folder="videos"]');
      if (folderBtn && currentCategory) {
        openCategory(currentCategory, true, 'videos');
        return;
      }
      // فيديو: يفتح في نافذة تشغيل
      const vthumb = e.target.closest('.cert-video-thumb');
      if (vthumb) {
        openVideoLightbox(vthumb.getAttribute('data-video'), vthumb.getAttribute('data-title') || '');
        return;
      }
      // زر معاينة PDF
      const viewBtn = e.target.closest('.cert-view-btn');
      if (viewBtn) {
        const full = viewBtn.getAttribute('data-full');
        const label = viewBtn.getAttribute('data-title') || '';
        openCertLightbox(full, label);
        return;
      }
      // زر تحميل PDF: <a download> بيتصرف لوحده، مفيش داعي لجافاسكريبت
      if (e.target.closest('.cert-download-btn')) return;

      // الضغط على الصورة المصغّرة: يفتح لايت بوكس بالصورة
      const thumb = e.target.closest('.cert-thumb');
      if (thumb) {
        const full = thumb.getAttribute('data-full');
        const label = thumb.getAttribute('data-title') || '';
        openCertLightbox(full, label);
      }
    });
    certLightboxClose.addEventListener('click', closeCertLightbox);

    // ===== Video lightbox =====
    const videoLightbox = document.getElementById('videoLightbox');
    const videoLightboxClose = document.getElementById('videoLightboxClose');
    const videoWrap = document.getElementById('videoWrap');
    const videoCaption = document.getElementById('videoCaption');

    function openVideoLightbox(url, caption){
      const id = youtubeId(url);
      videoWrap.innerHTML = '';
      if (id) {
        const f = document.createElement('iframe');
        f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&playsinline=1';
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        f.allowFullscreen = true;
        f.referrerPolicy = 'strict-origin-when-cross-origin';
        f.title = caption || 'Video';
        videoWrap.appendChild(f);
      } else {
        const v = document.createElement('video');
        v.src = url;
        v.controls = true;
        v.autoplay = true;
        v.playsInline = true;
        videoWrap.appendChild(v);
      }
      videoCaption.textContent = caption || '';
      videoLightbox.classList.add('open');
      videoLightboxClose.style.display = 'flex';
    }
    function closeVideoLightbox(){
      videoLightbox.classList.remove('open');
      videoLightboxClose.style.display = 'none';
      videoWrap.innerHTML = ''; // بيوقف الفيديو
      videoCaption.textContent = '';
    }
    videoLightboxClose.addEventListener('click', closeVideoLightbox);
    videoLightbox.addEventListener('click', (e) => {
      if (e.target === videoLightbox) closeVideoLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && videoLightbox.classList.contains('open')) closeVideoLightbox();
    });
    certLightbox.addEventListener('click', (e) => {
      if (e.target === certLightbox) closeCertLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && certLightbox.classList.contains('open')) closeCertLightbox();
    });

    // مشاركة الشهادة المفتوحة حاليًا (صورة أو رابط حسب دعم المتصفح)
    certLightboxShare.addEventListener('click', async () => {
      const src = certLightboxImg.src;
      const caption = certLightboxCaption.textContent || t('certificate');
      try {
        if (navigator.share) {
          if (navigator.canShare) {
            const res = await fetch(src);
            const blob = await res.blob();
            const file = new File([blob], (caption || 'certificate') + '.jpg', { type: blob.type || 'image/jpeg' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: caption, text: caption });
              return;
            }
          }
          await navigator.share({ title: caption, url: src });
        } else {
          await navigator.clipboard.writeText(src);
          showToast(t('toastCertLinkCopied'));
        }
      } catch (e) {
        // المستخدم لغى المشاركة أو حصل خطأ — تجاهل بهدوء
      }
    });

    function buildVideosFolder(n){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cert-category-item';
      btn.setAttribute('data-folder', 'videos');
      btn.innerHTML = `
        <span class="cert-category-icon" style="--tile:#FF3B30">${svgIcon('play')}</span>
        <span class="cert-category-label">${escapeHtml(t('videosHeading'))}</span>
        <span class="cert-category-count">${escapeHtml(t('videoCount', n))}</span>
      `;
      return btn;
    }
    function renderVideos(videos){
      certGrid.innerHTML = '';
      hideCertSkeleton();
      certCategoryGrid.style.display = 'none';
      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${certificatesData.length})`;
      const sortedV = [...videos].sort((a, b) => {
        const da = new Date(a.date || a.year || 0).getTime() || 0;
        const db = new Date(b.date || b.year || 0).getTime() || 0;
        return db - da;
      });
      const frag = document.createDocumentFragment();
      sortedV.forEach((v) => frag.appendChild(buildVideoCard(v)));
      certGrid.appendChild(frag);
      certGrid.style.display = 'grid';
    }
    function isVideoItem(c){
      return !!(c && c.video);
    }
    function youtubeId(url){
      try {
        const u = new URL(url, window.location.href);
        const h = u.hostname.replace(/^www\./, '');
        if (h === 'youtu.be') return u.pathname.slice(1).split('/')[0];
        if (h.endsWith('youtube.com') || h.endsWith('youtube-nocookie.com')) {
          if (u.searchParams.get('v')) return u.searchParams.get('v');
          const m = u.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/);
          if (m) return m[2];
        }
      } catch (_) {}
      return '';
    }
    function buildVideoCard(v){
      const url = v.video;
      const ytId = youtubeId(url);
      const title = itemTitle(v);
      const poster = v.thumbnail || v.image || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');

      const item = document.createElement('div');
      item.className = 'cert-item';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cert-video-thumb';
      btn.setAttribute('data-video', url);
      btn.setAttribute('data-title', title);

      if (poster) {
        const imgEl = document.createElement('img');
        imgEl.className = 'video-poster';
        imgEl.src = poster;
        imgEl.alt = title || 'Video';
        imgEl.loading = 'lazy';
        imgEl.addEventListener('load', () => imgEl.classList.add('loaded'));
        btn.appendChild(imgEl);
      } else {
        const ph = document.createElement('div');
        ph.className = 'video-poster';
        btn.appendChild(ph);
      }

      const play = document.createElement('span');
      play.className = 'video-play';
      play.innerHTML = svgIcon('play');
      btn.appendChild(play);

      const label = document.createElement('div');
      label.className = 'cert-label';
      label.textContent = title;
      btn.appendChild(label);

      item.appendChild(btn);
      return item;
    }

    function renderCertificates(list, videoCount = 0){
      certGrid.innerHTML = '';
      hideCertSkeleton();
      certCategoryGrid.style.display = 'none';
      if (!Array.isArray(list) || (list.length === 0 && videoCount === 0)){
        certGrid.style.display = 'none';
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
        return;
      }

      // ترتيب الشهادات بالأحدث أولاً لو فيه تاريخ متاح (date أو year)
      const sorted = [...list].sort((a, b) => {
        const da = new Date(a.date || a.year || 0).getTime() || 0;
        const db = new Date(b.date || b.year || 0).getTime() || 0;
        return db - da;
      });

      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${certificatesData.length})`;
      const frag = document.createDocumentFragment();
      // مجلد "Videos" بيظهر أول حاجة جوه القسم (لو فيه فيديوهات)، والشهادات تحته
      if (videoCount > 0) frag.appendChild(buildVideosFolder(videoCount));
      sorted.forEach((cert) => {
        const img = cert.image || cert.img || '';
        const full = cert.full || img;
        const title = itemTitle(cert);
        const pdf = cert.pdf || '';
        if (!img) return;

        const item = document.createElement('div');
        item.className = 'cert-item';

        const thumb = document.createElement('button');
        thumb.className = 'cert-thumb';
        thumb.type = 'button';
        thumb.style.cssText = 'display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;font:inherit;';
        thumb.setAttribute('data-full', full);
        thumb.setAttribute('data-title', title);

        const imgEl = document.createElement('img');
        imgEl.src = img;
        imgEl.alt = title || t('certificate');
        imgEl.loading = 'lazy';
        imgEl.addEventListener('load', () => imgEl.classList.add('loaded'));

        const label = document.createElement('div');
        label.className = 'cert-label';
        label.textContent = title;

        thumb.appendChild(imgEl);
        thumb.appendChild(label);
        item.appendChild(thumb);

        // زر معاينة وتحميل الـ PDF (زي اللي عند الـ CV) — بيظهروا بس لو فيه ملف pdf متحدد
        if (pdf) {
          const actions = document.createElement('div');
          actions.className = 'cert-item-actions';

          const viewBtn = document.createElement('button');
          viewBtn.className = 'btn-mini outline cert-view-btn';
          viewBtn.type = 'button';
          viewBtn.setAttribute('data-full', full);
          viewBtn.setAttribute('data-title', title);
          viewBtn.innerHTML = svgIcon('eye') + ' ' + escapeHtml(t('preview'));

          const downloadBtn = document.createElement('a');
          downloadBtn.className = 'btn-mini solid cert-download-btn';
          downloadBtn.href = pdf;
          downloadBtn.setAttribute('download', '');
          downloadBtn.innerHTML = svgIcon('download') + ' ' + escapeHtml(t('download'));

          actions.appendChild(viewBtn);
          actions.appendChild(downloadBtn);
          item.appendChild(actions);
        }

        frag.appendChild(item);
      });
      certGrid.appendChild(frag);
      certGrid.style.display = 'grid';
      hideCertSkeleton();
    }

    fetch('certificates.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('certificates.json not found');
        return res.json();
      })
      .then((data) => {
        certificatesState = 'ready';
        certificatesData = Array.isArray(data) ? data : [];
        // لو الشاشة مفتوحة فعلاً وقاعدة تستنى التحميل، اعرض الأقسام على طول
        if (window.location.hash.toLowerCase().startsWith('#certifications')) {
          syncCertificatesFromHash();
        } else if (certificatesOverlay.classList.contains('open')) {
          renderCategories(certificatesData);
        }
      })
      .catch(() => {
        certificatesState = 'error';
        certCategoryGrid.innerHTML = '';
        certGrid.innerHTML = '';
        hideCertSkeleton();
        certCategoryGrid.style.display = 'none';
        certGrid.style.display = 'none';
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
      });

    // افتح القسم المطلوب تلقائيًا عند دخول الزائر برابط مشاركة مباشر.
    if (window.location.hash.toLowerCase().startsWith('#certifications')) {
      syncCertificatesFromHash();
    }

    // Dark mode: follow system by default, allow manual override
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyStoredTheme(){
      const saved = localStorage.getItem('theme'); // 'light' | 'dark' | null
      if (saved === 'light' || saved === 'dark') {
        root.setAttribute('data-theme', saved);
      } else {
        root.removeAttribute('data-theme'); // follow system
      }
    }

    themeToggle.addEventListener('click', () => {
      const currentlyDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && systemDark.matches);
      const next = currentlyDark ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      root.setAttribute('data-theme', next);
    });

    // If user hasn't manually overridden, react live to system changes
    systemDark.addEventListener('change', () => {
      if (!localStorage.getItem('theme')) applyStoredTheme();
    });

    applyStoredTheme();

    // Toast helper
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // Shared contact info
    const CONTACT = {
      name: 'Mohamed Shaban',
      phone: '+201094517814',
      email: 'eng.m.shaban.kfs@gmail.com',
      site: 'https://engshab.blogspot.com/'
    };

    // Copy WhatsApp number
    document.getElementById('copyNumberBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(CONTACT.phone);
        showToast(t('toastCopied'));
      } catch (e) {
        showToast(t('toastCopyFail'));
      }
    });

    // Save contact as vCard
    document.getElementById('saveContactBtn').addEventListener('click', () => {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Mohamed_Shaban.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(t('toastSaved'));
    });

    // Share profile
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = {
        title: t('pageTitle'),
        text: t('shareText'),
        url: window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(shareData.url);
          showToast(t('toastLinkCopied'));
        } catch (e) {
          showToast(t('toastShareFail'));
        }
      }
    });

    // QR code sheet
    const qrSheet = document.getElementById('qrSheet');
    const qrSheetCancel = document.getElementById('qrSheetCancel');
    const qrImage = document.getElementById('qrImage');
    const qrTabSite = document.getElementById('qrTabSite');
    const qrTabWhatsapp = document.getElementById('qrTabWhatsapp');
    const qrTabContact = document.getElementById('qrTabContact');
    const qrTabs = [qrTabSite, qrTabWhatsapp, qrTabContact];

    function qrUrl(data){
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(data)}`;
    }
    function contactVcardText(){
      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
    }
    function setQrTab(tab){
      qrTabs.forEach((btn) => btn.classList.remove('active'));
      if (tab === 'site') {
        qrImage.src = qrUrl(window.location.href);
        qrTabSite.classList.add('active');
      } else if (tab === 'whatsapp') {
        qrImage.src = qrUrl(`https://wa.me/${CONTACT.phone.replace('+','')}`);
        qrTabWhatsapp.classList.add('active');
      } else {
        // مسح مباشر بالكاميرا بيحفظ جهة الاتصال كاملة على الموبايل
        qrImage.src = qrUrl(contactVcardText());
        qrTabContact.classList.add('active');
      }
    }
    document.getElementById('qrBtn').addEventListener('click', () => {
      setQrTab('site');
      qrSheet.classList.add('open');
    });
    qrTabSite.addEventListener('click', () => setQrTab('site'));
    qrTabWhatsapp.addEventListener('click', () => setQrTab('whatsapp'));
    qrTabContact.addEventListener('click', () => setQrTab('contact'));
    qrSheetCancel.addEventListener('click', () => qrSheet.classList.remove('open'));
    qrSheet.addEventListener('click', (e) => {
      if (e.target === qrSheet) qrSheet.classList.remove('open');
    });

    // ===================== Language switch =====================
    const langToggle = document.getElementById('langToggle');
    const langLabel = document.getElementById('langLabel');
    const metaDescEl = document.querySelector('meta[name="description"]');

    function applyLang(){
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t('pageTitle');
      if (metaDescEl) metaDescEl.setAttribute('content', t('metaDesc'));

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
      });
      langLabel.textContent = t('langBtn');
      updateCvBtn();

      // ابدأ كتابة النصوص من الأول باللغة الجديدة
      textIndex = 0;
      charIndex = 0;
      isDeleting = false;
      typingEl.textContent = '';

      // أعد رسم الشاشات المفتوحة باللغة الجديدة
      if (certificatesOverlay.classList.contains('open') && certificatesState === 'ready') {
        if (currentCategory) openCategory(currentCategory, false, currentSub);
        else renderCategories(certificatesData);
      }
      if (projectsOverlay.classList.contains('open')) refreshProjectsView();
      if (calcOverlay.classList.contains('open')) renderCalcs();
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      // مفيش حفظ للغة: كل ما الصفحة تتفتح من جديد ترجع إنجليزي
      applyLang();
    });

    applyLang();  </script>
