  <style>
    :root{
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --secondary: #8a8a8e;
      --blue: #007aff;
      --separator: #e5e5ea;
      --green: #34c759;
      --red: #ff3b30;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
      --sheet-bg: rgba(255,255,255,0.97);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --secondary: #98989d;
        --blue: #0a84ff;
        --separator: #38383a;
        --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
        --sheet-bg: rgba(28,28,30,0.97);
        color-scheme: dark;
      }
    }

    [data-theme="dark"]{
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #98989d;
      --blue: #0a84ff;
      --separator: #38383a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --sheet-bg: rgba(28,28,30,0.97);
      color-scheme: dark;
    }

    *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display:flex;
      justify-content:center;
      padding: 56px 16px;
      transition: background .3s ease, color .3s ease;
    }

    /* theme toggle */
    .theme-toggle{
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: var(--shadow);
      border: none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color: var(--text);
      font-size: 16px;
      z-index: 50;
      transition: background .3s ease, color .3s ease, transform .15s ease;
    }
    .theme-toggle:active{ transform: scale(0.92); }
    .theme-toggle .fa-sun{ display:none; }
    .theme-toggle .fa-moon{ display:inline; }
    [data-theme="dark"] .theme-toggle .fa-sun{ display:inline; color:#ffd60a; }
    [data-theme="dark"] .theme-toggle .fa-moon{ display:none; }
    @media (prefers-color-scheme: dark){
      html:not([data-theme="light"]) .theme-toggle .fa-sun{ display:inline; color:#ffd60a; }
      html:not([data-theme="light"]) .theme-toggle .fa-moon{ display:none; }
    }

    .container{
      width:100%;
      max-width: 400px;
    }

    /* profile header */
    .profile-header{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      margin-bottom: 28px;
    }

    .profile-pic{
      width: 148px;
      height: 148px;
      border-radius: 50%;
      overflow:hidden;
      box-shadow: var(--shadow);
      border: 3px solid var(--card);
      margin-bottom: 16px;
      transition: transform .2s ease;
    }
    .profile-pic:active{ transform: scale(0.97); }
    .profile-pic img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    h1{
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }

    .status-line{
      font-size: 15px;
      color: var(--secondary);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 20px;
    }
    .typing{
      white-space:nowrap;
      overflow:hidden;
      border-right: 2px solid var(--blue);
      animation: blink-cursor .8s steps(1) infinite;
      padding-right:2px;
      color: var(--blue);
      font-weight: 700;
    }
    @keyframes blink-cursor{ 50%{ border-color: transparent; } }

    /* grouped list card */
    .group-title{
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 8px 14px;
    }

    .card{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .row{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px 16px;
      text-decoration:none;
      color: var(--text);
      position: relative;
      transition: background .15s ease;
    }
    .row:active{ background: rgba(120,120,128,0.12); }
    .row + .row{ border-top: 1px solid var(--separator); }
    button.row{
      width:100%;
      background: none;
      font-family: inherit;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      border:none;
      outline:none;
      margin:0;
    }

    .row-icon{
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size: 15px;
      flex-shrink:0;
    }
    .icon-whatsapp{ background:#25D366; }
    .icon-email{ background:#8E8E93; }
    .icon-linkedin{ background:#0A66C2; }
    .icon-facebook{ background:#1877F2; }
    .icon-youtube{ background:#FF0000; }
    .icon-telegram{ background:#229ED9; }
    .icon-group{ background:#5856D6; }
    .icon-blog{ background:#FF9500; }

    .row-label{
      flex:1;
      font-size: 15.5px;
      font-weight: 500;
      text-align: left;
    }

    .row-chevron{
      color: #c7c7cc;
      font-size: 13px;
    }

    /* CV actions */
    .cv-actions{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration:none;
      cursor:pointer;
      border: none;
      font-family: inherit;
      transition: opacity .15s ease, transform .1s ease;
    }
    .btn:active{ transform: scale(0.985); opacity:0.9; }

    .btn.solid{
      background: var(--blue);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .btn.outline{
      background: var(--card);
      color: var(--blue);
      box-shadow: var(--shadow);
    }

    /* inline CV viewer */
    .cv-viewer{
      max-height:0;
      overflow:hidden;
      margin-top:0;
      border-radius: 14px;
      transition: max-height .4s ease, margin-top .4s ease;
      background: var(--card);
    }
    .cv-viewer.open{
      max-height:600px;
      margin-top:14px;
      box-shadow: var(--shadow);
    }
    .cv-viewer iframe{
      width:100%;
      height:560px;
      border:0;
      border-radius: 14px;
      background:#fff;
      display:block;
    }

    footer{
      text-align:center;
      font-size: 12px;
      color: var(--secondary);
      margin-top: 22px;
    }

    @media (max-width:480px){
      .profile-pic{ width:128px; height:128px; }
      h1{ font-size: 20px; }
      .row-label{ font-size: 15px; }
      .cv-viewer.open{ max-height:420px; }
      .cv-viewer iframe{ height:400px; }
    }

    /* action sheet */
    .sheet-backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      z-index:100;
      opacity:0;
      pointer-events:none;
      transition: background .25s ease, opacity .25s ease;
    }
    .sheet-backdrop.open{
      background: rgba(0,0,0,0.35);
      opacity:1;
      pointer-events:auto;
    }
    .sheet{
      width:100%;
      max-width: 400px;
      margin: 0 16px 16px;
      transform: translateY(110%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .sheet-backdrop.open .sheet{
      transform: translateY(0);
    }
    .sheet-group{
      background: var(--sheet-bg);
      border-radius: 14px;
      overflow:hidden;
      margin-bottom: 8px;
      text-align:center;
    }
    .sheet-title{
      padding: 14px 16px 12px;
      font-size: 13px;
      color: var(--secondary);
      border-bottom: 1px solid var(--separator);
    }
    .sheet-option{
      display:block;
      width:100%;
      padding: 15px 16px;
      background:none;
      border:none;
      font-family:inherit;
      font-size: 17px;
      font-weight: 500;
      color: var(--blue);
      text-decoration:none;
      cursor:pointer;
    }
    .sheet-option:active{ background: rgba(120,120,128,0.16); }
    .sheet-option + .sheet-option{ border-top: 1px solid var(--separator); }
    .sheet-cancel{
      display:block;
      width:100%;
      padding: 15px 16px;
      background: var(--sheet-bg);
      border-radius: 14px;
      border:none;
      font-family:inherit;
      font-size: 17px;
      font-weight: 600;
      color: var(--blue);
      cursor:pointer;
    }
    .sheet-cancel:active{ background: rgba(120,120,128,0.16); }

    /* quick actions row (icon-only buttons) */
    .quick-actions{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .quick-action{
      background: var(--card);
      border: none;
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 8px;
      cursor:pointer;
      font-family: inherit;
      color: var(--text);
      transition: transform .1s ease, opacity .15s ease;
    }
    .quick-action:active{ transform: scale(0.95); opacity:0.85; }
    .quick-action i{ font-size: 17px; color: var(--blue); }
    .quick-action span{ font-size: 11.5px; font-weight: 600; text-align:center; line-height:1.2; }

    /* QR sheet */
    .qr-box{
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      display:flex;
      justify-content:center;
      margin: 4px 0 14px;
    }
    .qr-box img{
      width: 190px;
      height: 190px;
      display:block;
    }
    .qr-tabs{
      display:flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .qr-tab{
      flex:1;
      padding: 8px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      background: rgba(120,120,128,0.12);
      color: var(--text);
      cursor:pointer;
    }
    .qr-tab.active{
      background: var(--blue);
      color:#fff;
    }

    /* toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(28,28,30,0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      white-space:nowrap;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <script>
    // Typing effect
    const texts = [
      "Mechanical Power Engineer",
      "Energy & Machines Specialist",
      "Industrial Maintenance Expert",
      "Always Learning & Innovating"
    ];
    const typingEl = document.getElementById('typing');
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function tick() {
      const current = texts[textIndex];
      if (!isDeleting) {
        charIndex++;
        typingEl.textContent = current.slice(0, charIndex);
      } else {
        charIndex--;
        typingEl.textContent = current.slice(0, charIndex);
      }

      let delay = isDeleting ? 55 : 110;

      if (!isDeleting && charIndex === current.length) {
        delay = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        delay = 300;
      }
      setTimeout(tick, delay);
    }
    tick();

    // View CV toggle (inline viewer)
    const viewCvBtn = document.getElementById('viewCvBtn');
    const cvViewer = document.getElementById('cvViewer');
    const cvFrame = document.getElementById('cvFrame');
    let cvLoaded = false;

    viewCvBtn.addEventListener('click', () => {
      const isOpen = cvViewer.classList.toggle('open');
      if (isOpen) {
        if (!cvLoaded) {
          cvFrame.src = 'cv.pdf';
          cvLoaded = true;
        }
        viewCvBtn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide CV';
        cvViewer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        viewCvBtn.innerHTML = '<i class="fas fa-eye"></i> View CV';
      }
    });

    // Telegram action sheet
    const telegramBtn = document.getElementById('telegramBtn');
    const telegramSheet = document.getElementById('telegramSheet');
    const telegramSheetCancel = document.getElementById('telegramSheetCancel');

    function openTelegramSheet(){
      telegramSheet.classList.add('open');
    }
    function closeTelegramSheet(){
      telegramSheet.classList.remove('open');
    }

    telegramBtn.addEventListener('click', openTelegramSheet);
    telegramSheetCancel.addEventListener('click', closeTelegramSheet);
    telegramSheet.addEventListener('click', (e) => {
      if (e.target === telegramSheet) closeTelegramSheet();
    });

    // Dark mode: follow system by default, allow manual override
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyStoredTheme(){
      const saved = localStorage.getItem('theme'); // 'light' | 'dark' | null
      if (saved === 'light' || saved === 'dark') {
        root.setAttribute('data-theme', saved);
      } else {
        root.removeAttribute('data-theme'); // follow system
      }
    }

    themeToggle.addEventListener('click', () => {
      const currentlyDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && systemDark.matches);
      const next = currentlyDark ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      root.setAttribute('data-theme', next);
    });

    // If user hasn't manually overridden, react live to system changes
    systemDark.addEventListener('change', () => {
      if (!localStorage.getItem('theme')) applyStoredTheme();
    });

    applyStoredTheme();

    // Toast helper
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // Shared contact info
    const CONTACT = {
      name: 'Mohamed Shaban',
      phone: '+201094517814',
      email: 'eng.m.shaban.kfs@gmail.com',
      site: 'https://engshab.blogspot.com/'
    };

    // Copy WhatsApp number
    document.getElementById('copyNumberBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(CONTACT.phone);
        showToast('تم نسخ الرقم');
      } catch (e) {
        showToast('تعذر نسخ الرقم');
      }
    });

    // Save contact as vCard
    document.getElementById('saveContactBtn').addEventListener('click', () => {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Mohamed_Shaban.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('تم حفظ جهة الاتصال');
    });

    // Share profile
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = {
        title: 'Mohamed Shaban | Mechanical Engineer',
        text: 'تواصل مع المهندس محمد شعبان',
        url: window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(shareData.url);
          showToast('تم نسخ رابط الصفحة');
        } catch (e) {
          showToast('تعذر مشاركة الرابط');
        }
      }
    });

    // QR code sheet
    const qrSheet = document.getElementById('qrSheet');
    const qrSheetCancel = document.getElementById('qrSheetCancel');
    const qrImage = document.getElementById('qrImage');
    const qrTabSite = document.getElementById('qrTabSite');
    const qrTabWhatsapp = document.getElementById('qrTabWhatsapp');

    function qrUrl(data){
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(data)}`;
    }
    function setQrTab(tab){
      if (tab === 'site') {
        qrImage.src = qrUrl(window.location.href);
        qrTabSite.classList.add('active');
        qrTabWhatsapp.classList.remove('active');
      } else {
        qrImage.src = qrUrl(`https://wa.me/${CONTACT.phone.replace('+','')}`);
        qrTabWhatsapp.classList.add('active');
        qrTabSite.classList.remove('active');
      }
    }
    document.getElementById('qrBtn').addEventListener('click', () => {
      setQrTab('site');
      qrSheet.classList.add('open');
    });
    qrTabSite.addEventListener('click', () => setQrTab('site'));
    qrTabWhatsapp.addEventListener('click', () => setQrTab('whatsapp'));
    qrSheetCancel.addEventListener('click', () => qrSheet.classList.remove('open'));
    qrSheet.addEventListener('click', (e) => {
      if (e.target === qrSheet) qrSheet.classList.remove('open');
    });
  </script>
</body>
</html>
