  <style>
    :root{
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --secondary: #8a8a8e;
      --blue: #007aff;
      --separator: #e5e5ea;
      --green: #34c759;
      --red: #ff3b30;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
      --sheet-bg: rgba(255,255,255,0.97);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --secondary: #98989d;
        --blue: #0a84ff;
        --separator: #38383a;
        --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
        --sheet-bg: rgba(28,28,30,0.97);
        color-scheme: dark;
      }
    }

    [data-theme="dark"]{
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #98989d;
      --blue: #0a84ff;
      --separator: #38383a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --sheet-bg: rgba(28,28,30,0.97);
      color-scheme: dark;
    }

    *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
      display:flex;
      justify-content:center;
      padding: 56px 16px;
      transition: background .3s ease, color .3s ease;
    }

    /* theme toggle */
    .theme-toggle{
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: var(--shadow);
      border: none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color: var(--text);
      font-size: 16px;
      z-index: 50;
      transition: background .3s ease, color .3s ease, transform .15s ease;
    }
    .theme-toggle:active{ transform: scale(0.92); }
    .theme-toggle .fa-sun{ display:none; }
    .theme-toggle .fa-moon{ display:inline; }
    [data-theme="dark"] .theme-toggle .fa-sun{ display:inline; color:#ffd60a; }
    [data-theme="dark"] .theme-toggle .fa-moon{ display:none; }
    @media (prefers-color-scheme: dark){
      html:not([data-theme="light"]) .theme-toggle .fa-sun{ display:inline; color:#ffd60a; }
      html:not([data-theme="light"]) .theme-toggle .fa-moon{ display:none; }
    }

    /* language toggle (EN / AR) */
    .lang-toggle{
      position: fixed;
      top: 18px;
      left: 18px;
      height: 40px;
      padding: 0 14px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
      border: none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 7px;
      cursor:pointer;
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      z-index: 50;
      transition: background .3s ease, color .3s ease, transform .15s ease;
    }
    .lang-toggle i{ color: var(--blue); font-size: 14px; }
    .lang-toggle:active{ transform: scale(0.94); }

    .container{
      width:100%;
      max-width: 400px;
    }

    /* direction-aware helpers */
    html[dir="rtl"] .row-chevron{ transform: scaleX(-1); }
    html[dir="ltr"] .back-arrow{ transform: scaleX(-1); }

    /* profile header */
    .profile-header{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      margin-bottom: 28px;
    }

    .profile-pic{
      width: 148px;
      height: 148px;
      border-radius: 50%;
      overflow:hidden;
      box-shadow: var(--shadow);
      border: 3px solid var(--card);
      margin-bottom: 16px;
      transition: transform .2s ease;
      padding:0;
      background:none;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }
    .profile-pic:active{ transform: scale(0.97); }
    .profile-pic img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    h1{
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }
    html[dir="rtl"] h1{ letter-spacing: 0; }

    .tagline{
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.6;
      max-width: 340px;
      margin: 0 0 8px;
    }

    .status-line{
      font-size: 15px;
      color: var(--secondary);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 20px;
    }
    .typing{
      white-space:nowrap;
      overflow:hidden;
      border-inline-end: 2px solid var(--blue);
      animation: blink-cursor .8s steps(1) infinite;
      padding-inline-end:2px;
      color: var(--blue);
      font-weight: 700;
    }
    @keyframes blink-cursor{ 50%{ border-color: transparent; } }

    /* grouped list card */
    .group-title{
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 8px;
      margin-inline-start: 14px;
    }
    html[dir="rtl"] .group-title{ letter-spacing: 0; }

    .card{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .row{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px 16px;
      text-decoration:none;
      color: var(--text);
      position: relative;
      transition: background .15s ease;
    }
    .row:active{ background: rgba(120,120,128,0.12); }
    .row + .row{ border-top: 1px solid var(--separator); }
    button.row{
      width:100%;
      background: none;
      font-family: inherit;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      border:none;
      outline:none;
      margin:0;
    }

    .row-icon{
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size: 15px;
      flex-shrink:0;
    }
    .icon-whatsapp{ background:#25D366; }
    .icon-call{ background:#34C759; }
    .icon-email{ background:#8E8E93; }
    .icon-linkedin{ background:#0A66C2; }
    .icon-facebook{ background:#1877F2; }
    .icon-youtube{ background:#FF0000; }
    .icon-telegram{ background:#229ED9; }
    .icon-group{ background:#5856D6; }
    .icon-blog{ background:#FF9500; }
    .icon-projects{ background:#30B0C7; }

    .row-label{
      flex:1;
      font-size: 15.5px;
      font-weight: 500;
      text-align: start;
    }

    .row-chevron{
      color: #c7c7cc;
      font-size: 13px;
    }

    /* CV actions */
    .cv-actions{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration:none;
      cursor:pointer;
      border: none;
      font-family: inherit;
      transition: opacity .15s ease, transform .1s ease;
    }
    .btn:active{ transform: scale(0.985); opacity:0.9; }

    .btn.solid{
      background: var(--blue);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .btn.outline{
      background: var(--card);
      color: var(--blue);
      box-shadow: var(--shadow);
    }

    /* inline CV viewer */
    .cv-viewer{
      max-height:0;
      overflow:hidden;
      margin-top:0;
      border-radius: 14px;
      transition: max-height .4s ease, margin-top .4s ease;
      background: var(--card);
    }
    .cv-viewer.open{
      max-height:600px;
      margin-top:14px;
      box-shadow: var(--shadow);
    }
    .cv-viewer iframe{
      width:100%;
      height:560px;
      border:0;
      border-radius: 14px;
      background:#fff;
      display:block;
    }

    /* ===== Certificates overlay ===== */
    .cert-overlay-backdrop{
      position:fixed;
      inset:0;
      background: var(--bg);
      z-index: 160;
      opacity:0;
      pointer-events:none;
      transform: translateY(12px);
      transition: opacity .25s ease, transform .25s ease;
      overflow-y:auto;
      -webkit-overflow-scrolling: touch;
    }
    .cert-overlay-backdrop.open{
      opacity:1;
      pointer-events:auto;
      transform: translateY(0);
    }
    .cert-overlay-header{
      position:sticky;
      top:0;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--separator);
      z-index: 1;
    }
    .cert-overlay-back{
      display:flex;
      align-items:center;
      gap:8px;
      background: var(--card);
      color: var(--blue);
      border:none;
      border-radius: 20px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .cert-overlay-back:active{ transform: scale(0.95); }
    .cert-overlay-title{
      flex:1;
      text-align:center;
      font-size: 16px;
      font-weight: 700;
      margin-inline-end: 40px;
    }
    .cert-overlay-body{
      padding: 16px;
      max-width: 400px;
      margin: 0 auto;
    }

    /* ===== Certificates section ===== */
    .cert-grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    /* Skeleton loading placeholders */
    .cert-skeleton-item{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cert-skeleton-item .cert-skeleton-img{
      height: 108px;
      background: linear-gradient(90deg, var(--separator) 25%, rgba(120,120,128,0.18) 37%, var(--separator) 63%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }
    .cert-skeleton-item .cert-skeleton-label{
      height: 12px;
      margin: 10px 14px 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--separator) 25%, rgba(120,120,128,0.18) 37%, var(--separator) 63%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }
    @keyframes skeleton-shimmer{
      0%{ background-position: 100% 50%; }
      100%{ background-position: 0 50%; }
    }
    .cert-loading-text{
      text-align:center;
      color: var(--secondary);
      font-size: 13px;
      margin: -8px 0 16px;
      display:none;
    }

    .row-label small{
      color: var(--secondary);
      font-weight: 500;
      font-size: 13px;
    }

    /* certificate image fade-in once loaded */
    .cert-item img{
      opacity:0;
      transition: opacity .25s ease;
    }
    .cert-item img.loaded{ opacity:1; }

    /* share button inside certificate lightbox */
    .lightbox-share{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:14px;
      background: rgba(255,255,255,0.15);
      color:#fff;
      border:none;
      border-radius: 20px;
      padding: 9px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor:pointer;
    }
    .lightbox-share:active{ transform: scale(0.95); }

    /* view/download buttons under each certificate card */
    .cert-item-actions{
      display:flex;
      gap:6px;
      padding: 0 8px 10px;
    }
    .cert-item-actions .btn-mini{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      padding:8px 6px;
      border-radius:10px;
      font-size:11.5px;
      font-weight:600;
      text-decoration:none;
      cursor:pointer;
      border:none;
      font-family:inherit;
      transition: opacity .15s ease, transform .1s ease;
    }
    .cert-item-actions .btn-mini:active{ transform:scale(0.96); opacity:0.9; }
    .cert-item-actions .btn-mini.outline{
      background: var(--bg);
      color: var(--blue);
    }
    .cert-item-actions .btn-mini.solid{
      background: var(--blue);
      color:#fff;
    }

    /* category folder tiles (Certifications home) */
    .cert-category-item{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border:none;
      cursor:pointer;
      padding: 22px 10px 16px;
      font-family:inherit;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      transition: transform .1s ease, opacity .15s ease;
    }
    .cert-category-item:active{ transform: scale(0.97); opacity:0.9; }
    .cert-category-icon{
      width:58px;
      height:58px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:24px;
      flex-shrink:0;
    }
    .cert-category-icon.has-logo{
      background:#fff;
      padding:8px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    .cert-category-icon.has-logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    .cert-category-label{
      font-size:14px;
      font-weight:700;
      color:var(--text);
      text-align:center;
      line-height:1.3;
    }
    .cert-category-count{
      font-size:12px;
      font-weight:600;
      color:var(--secondary);
    }

    /* Projects detail */
    .project-detail{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-bottom: 24px;
      text-align:center;
    }
    .project-detail p{
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--secondary);
    }
    .project-detail .card{
      margin: 14px 0 0;
      box-shadow:none;
      border:1px solid var(--separator);
      text-align:start;
    }

    .project-detail .file-row{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px;
    }
    .project-detail .file-row .row-icon{ background:#FF3B30; }
    .project-detail .file-title{
      flex:1;
      min-width:0;
      font-size:14px;
      font-weight:600;
      color:var(--text);
      text-align:start;
      word-break:break-word;
    }
    .project-detail .file-actions{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }
    .project-detail .file-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:34px;
      border-radius:10px;
      border:none;
      font-size:14px;
      text-decoration:none;
      cursor:pointer;
    }
    .project-detail .file-btn.view{ background: var(--bg); color: var(--blue); }
    .project-detail .file-btn.download{ background: var(--blue); color:#fff; }
    .project-detail .file-btn:active{ transform: scale(0.94); }

    .cert-item{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow:hidden;
      cursor:pointer;
      border:none;
      padding:0;
      font-family:inherit;
      text-align:start;
      transition: transform .1s ease, opacity .15s ease;
    }
    .cert-item:active{ transform: scale(0.97); opacity:0.9; }
    .cert-item img{
      width:100%;
      height: 108px;
      object-fit: cover;
      display:block;
      background: #e5e5ea;
    }
    .cert-item .cert-label{
      padding: 8px 10px 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      text-align:center;
      line-height:1.3;
    }

    /* lightbox for full certificate / profile picture view */
    .lightbox-backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:200;
      opacity:0;
      pointer-events:none;
      padding: 24px;
      transition: background .25s ease, opacity .25s ease;
    }
    .lightbox-backdrop.open{
      background: rgba(0,0,0,0.85);
      opacity:1;
      pointer-events:auto;
    }
    .lightbox-content{
      max-width:100%;
      max-height:80vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display:block;
    }
    .lightbox-caption{
      color:#fff;
      text-align:center;
      font-size:14px;
      font-weight:600;
      margin-top:12px;
      opacity:0.9;
    }
    /* videos inside a certificates category */
    .cert-section-title{
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: 700;
      color: var(--secondary);
      margin: 6px 4px 0;
    }
    .cert-video-thumb{
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      font: inherit;
      text-align: start;
    }
    .cert-video-thumb .video-poster{
      width: 100%;
      height: 108px;
      display: block;
      object-fit: cover;
      background: linear-gradient(135deg, #1c1c1e, #3a3a3c);
    }
    .video-play{
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .video-play i{
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.58);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      padding-inline-start: 3px;
    }
    @media (max-width:480px){
      .cert-video-thumb .video-poster, .video-play{ height: 96px; }
    }
    .video-wrap{
      width: min(92vw, 880px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .video-wrap iframe, .video-wrap video{
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .lightbox-close{
      position:fixed;
      top:18px;
      right:18px;

      justify-content:center;
      z-index:100;

      pointer-events:none;

    }
    .sheet-backdrop.open{
      background: rgba(0,0,0,0.35);
      opacity:1;
      pointer-events:auto;
    }
    .sheet{
      width:100%;
      max-width: 400px;
      margin: 0 16px 16px;
      transform: translateY(110%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .sheet-backdrop.open .sheet{
      transform: translateY(0);
    }
    .sheet-group{
      background: var(--sheet-bg);
      border-radius: 14px;
      overflow:hidden;
      margin-bottom: 8px;
      text-align:center;
    }
    .sheet-title{
      padding: 14px 16px 12px;
      font-size: 13px;
      color: var(--secondary);
      border-bottom: 1px solid var(--separator);
    }
    .sheet-option{
      display:block;
      width:100%;
      padding: 15px 16px;
      background:none;
      border:none;
      font-family:inherit;
      font-size: 17px;
      font-weight: 500;
      color: var(--blue);
      text-decoration:none;
      cursor:pointer;
    }
    .sheet-option:active{ background: rgba(120,120,128,0.16); }
    .sheet-option + .sheet-option{ border-top: 1px solid var(--separator); }
    .sheet-cancel{
      display:block;
      width:100%;
      padding: 15px 16px;
      background: var(--sheet-bg);
      border-radius: 14px;
      border:none;
      font-family:inherit;
      font-size: 17px;
      font-weight: 600;
      color: var(--blue);
      cursor:pointer;
    }
    .sheet-cancel:active{ background: rgba(120,120,128,0.16); }

    .quick-actions{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .quick-action{
      background: var(--card);
      border: none;
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 8px;
      cursor:pointer;

      color: var(--text);

      // الإنجليزية دايمًا هي الافتراضي. الوحيد اللي بيغيّرها لينك فيه ?lang=ar
      const savedLang = new URLSearchParams(window.location.search).get('lang');
      if (savedLang === 'ar' || savedLang === 'en') lang = savedLang;
    } catch (_) {}

    function t(key, ...args){
      let v = I18N[lang][key];
      if (v === undefined) v = I18N.en[key];
      return typeof v === 'function' ? v(...args) : v;
    }
    function displayName(n){
      const m = NAME_MAP[n];
      return m ? m[lang] : n;
    }
    // عنوان عنصر من JSON: title_en / title_ar لو موجودين، وإلا title العادي
    function itemTitle(item, fallback = ''){
      return item['title_' + lang] || item.title || item.name || fallback;
    }

    // ===================== Typing effect =====================
    const typingEl = document.getElementById('typing');
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function tick() {
      const texts = t('typing');
      const current = texts[textIndex % texts.length];
      if (!isDeleting) {
        charIndex++;
        typingEl.textContent = current.slice(0, charIndex);
      } else {
        charIndex--;
        typingEl.textContent = current.slice(0, charIndex);
      }

      let delay = isDeleting ? 55 : 110;

      if (!isDeleting && charIndex >= current.length) {
        delay = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex <= 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        delay = 300;
      }
      setTimeout(tick, delay);
    }
    tick();

    function backBtnHtml(label){
      return '<i class="fas fa-arrow-right back-arrow"></i> ' + escapeHtml(label);
    }

    // View CV toggle (inline viewer على الديسكتوب، تاب جديد على الموبايل)
    const viewCvBtn = document.getElementById('viewCvBtn');
    const cvViewer = document.getElementById('cvViewer');
    const cvFrame = document.getElementById('cvFrame');
    let cvLoaded = false;

    // متصفحات الموبايل (خصوصًا كروم أندرويد) مش بتعرف تعرض PDF جوه iframe —
    // بتظهر كارت "فتح" بدل المعاينة. الحل: افتح الملف في تاب جديد بدل الـ iframe.
    const isMobileBrowser = window.matchMedia('(pointer: coarse)').matches;

    function updateCvBtn(){
      const isOpen = cvViewer.classList.contains('open');
      viewCvBtn.innerHTML = `<i class="fas ${isOpen ? 'fa-eye-slash' : 'fa-eye'}"></i> ${escapeHtml(t(isOpen ? 'hideCv' : 'viewCv'))}`;
    }

    viewCvBtn.addEventListener('click', () => {
      if (isMobileBrowser) {
        window.open('cv-viewer.html?v=' + Date.now(), '_blank');
        return;
      }
      const isOpen = cvViewer.classList.toggle('open');
      if (isOpen) {
        if (!cvLoaded) {
          cvFrame.src = 'cv.pdf';
          cvLoaded = true;
        }
        cvViewer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      updateCvBtn();
    });

    // Telegram action sheet
    const telegramBtn = document.getElementById('telegramBtn');
    const telegramSheet = document.getElementById('telegramSheet');
    const telegramSheetCancel = document.getElementById('telegramSheetCancel');

    function openTelegramSheet(){
      telegramSheet.classList.add('open');
    }
    function closeTelegramSheet(){
      telegramSheet.classList.remove('open');
    }

    telegramBtn.addEventListener('click', openTelegramSheet);
    telegramSheetCancel.addEventListener('click', closeTelegramSheet);
    telegramSheet.addEventListener('click', (e) => {
      if (e.target === telegramSheet) closeTelegramSheet();
    });

    // Profile picture lightbox (مع زر رجوع للصفحة الرئيسية)
    const profilePicBtn = document.getElementById('profilePicBtn');
    const profileLightbox = document.getElementById('profileLightbox');
    const profileLightboxBack = document.getElementById('profileLightboxBack');

    function openProfileLightbox(){
      profileLightbox.classList.add('open');
      profileLightboxBack.style.display = 'flex';
    }
    function closeProfileLightbox(){
      profileLightbox.classList.remove('open');
      profileLightboxBack.style.display = 'none';
    }

    profilePicBtn.addEventListener('click', openProfileLightbox);
    profileLightboxBack.addEventListener('click', closeProfileLightbox);
    profileLightbox.addEventListener('click', (e) => {
      if (e.target === profileLightbox) closeProfileLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && profileLightbox.classList.contains('open')) closeProfileLightbox();
    });

    // Certificates overlay open/close
    const certificatesBtn = document.getElementById('certificatesBtn');
    const certificatesOverlay = document.getElementById('certificatesOverlay');
    const certificatesOverlayBack = document.getElementById('certificatesOverlayBack');
    const certOverlayTitle = document.getElementById('certOverlayTitle');
    const certCountEl = document.getElementById('certCount');
    const certSkeletonGrid = document.getElementById('certSkeletonGrid');
    const certCategoryGrid = document.getElementById('certCategoryGrid');
    const certLoadingText = document.getElementById('certLoadingText');

    // كل قسم (category) بياخد أيقونة ولون مميز. عايز تضيف قسم جديد؟
    // زوّد سطر هنا بنفس اسم "category" اللي هتكتبه في certificates.json
    const categoryMeta = {
      // logo (اختياري): مسار صورة اللوجو. لو الصورة مش موجودة بيرجع للأيقونة تلقائيًا.
      'SOLIDWORKS': { icon: 'fa-cube', color: '#D0342C', logo: 'certificates/logos/solidworks.png' },
      'HVAC': { icon: 'fa-fan', color: '#0A84FF' },
      'دورات تدريبية': { icon: 'fa-briefcase', color: '#5856D6' }
    };
    function metaFor(cat){
      return categoryMeta[cat] || { icon: 'fa-folder', color: '#8E8E93' };
    }
    // أيقونة القسم: لوجو لو متحدد (وبيرجع للأيقونة لو الصورة فشلت)
    function categoryIconHtml(name, meta){
      if (meta.logo) {
        return `<span class="cert-category-icon has-logo"><img src="${escapeHtml(meta.logo)}" alt="${escapeHtml(name)}" onerror="this.parentNode.classList.remove('has-logo');this.parentNode.style.background='${meta.color}';this.outerHTML='<i class=&quot;fas ${meta.icon}&quot;></i>'"></span>`;
      }
      return `<span class="cert-category-icon" style="background:${meta.color}"><i class="fas ${meta.icon}"></i></span>`;
    }

    let currentCategory = null; // null = شاشة الأقسام الرئيسية
    let currentSub = null;      // null أو 'videos' (مجلد الفيديوهات جوه القسم)

    // Deep links: #certifications أو #certifications/HVAC
    function setCertificatesHash(category = null, sub = null){
      const nextHash = category
        ? '#certifications/' + encodeURIComponent(category) + (sub ? '/' + encodeURIComponent(sub) : '')
        : '#certifications';
      if (window.location.hash !== nextHash) window.location.hash = nextHash;
    }

    function openCertificatesOverlay(updateHash = true){
      certificatesOverlay.classList.add('open');
      certificatesOverlay.scrollTop = 0;
      currentCategory = null;
      if (updateHash && !window.location.hash.toLowerCase().startsWith('#certifications')) {
        setCertificatesHash();
      }
      // لو البيانات لسه ما وصلتش، اعرض حالة التحميل بدل شاشة فاضية
      if (certificatesState === 'loading') {
        showCertSkeleton();
      } else if (certificatesState === 'ready') {
        renderCategories(certificatesData);
      }
    }
    function closeCertificatesOverlay(updateHash = true){
      certificatesOverlay.classList.remove('open');
      if (updateHash && window.location.hash.toLowerCase().startsWith('#certifications')) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    function syncCertificatesFromHash(){
      const hash = window.location.hash || '';
      if (!hash.toLowerCase().startsWith('#certifications')) {
        if (certificatesOverlay.classList.contains('open')) closeCertificatesOverlay(false);
        return;
      }
      openCertificatesOverlay(false);
      if (certificatesState !== 'ready') return;
      const rawParts = hash.slice('#certifications'.length).replace(/^\//, '').split('/');
      const rawCategory = rawParts[0];
      let subPart = rawParts[1] || null;
      try { if (subPart) subPart = decodeURIComponent(subPart); } catch (_) {}
      if (rawCategory) {
        let category = rawCategory;
        try { category = decodeURIComponent(rawCategory); } catch (_) {}
        const categories = groupByCategory(certificatesData);
        if (Object.prototype.hasOwnProperty.call(categories, category)) {
          openCategory(category, false, subPart);
        } else {
          renderCategories(certificatesData);
        }
      } else {
        renderCategories(certificatesData);
      }
    }

    certificatesBtn.addEventListener('click', () => {
      if (window.location.hash.toLowerCase().startsWith('#certifications')) {
        syncCertificatesFromHash();
      } else {
        setCertificatesHash();
        openCertificatesOverlay(false);
      }
    });
    window.addEventListener('hashchange', syncCertificatesFromHash);
    certificatesOverlayBack.addEventListener('click', () => {
      // لو داخل قسم معيّن: ارجع لقائمة الأقسام. لو في قائمة الأقسام: اقفل الشاشة كلها.
      if (currentCategory && currentSub) {
        openCategory(currentCategory, true); // من مجلد الفيديوهات لصفحة القسم
      } else if (currentCategory) {
        setCertificatesHash();
        renderCategories(certificatesData);
      } else {
        closeCertificatesOverlay(true);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && certificatesOverlay.classList.contains('open')) closeCertificatesOverlay();
    });

    // ===== Projects =====
    // بيانات المشاريع بتتحمّل تلقائي من ملف projects.json (نفس مجلد الصفحة، زي certificates.json).
    // كل عنصر في الملف: { "title": "اسم الملف", "category": "اسم المشروع", "pdf": "مسار الـ PDF" }
    // عايز تضيف/تشيل ملف؟ عدّل projects.json بس.
    // عايز مشروع جديد يظهر حتى قبل ما تضيفله ملفات، أو تغيّر أيقونته/لونه؟ زوّد سطر في projectMeta.
    const projectMeta = {
      // logo (اختياري): مسار صورة اللوجو. لو الصورة مش موجودة بيرجع للأيقونة تلقائيًا.
      'Revit': { icon: 'fa-gear', color: '#FF9500', logo: 'projects/logos/revit.png' },
      'AutoCad': { icon: 'fa-drafting-compass', color: '#E5322D', logo: 'projects/logos/autocad.png' }
    };
    function projectMetaFor(name){
      return projectMeta[name] || { icon: 'fa-folder', color: '#8E8E93' };
    }

    const projectsBtn = document.getElementById('projectsBtn');
    const projectsOverlay = document.getElementById('projectsOverlay');
    const projectsOverlayBack = document.getElementById('projectsOverlayBack');
    const projectsOverlayTitle = document.getElementById('projectsOverlayTitle');
    const projectsGrid = document.getElementById('projectsGrid');
    const projectDetail = document.getElementById('projectDetail');
    let currentProject = null;
    let currentSection = null;
    let projectsState = 'loading'; // loading | ready | error
    let projectsData = [];

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function projectOf(item){
      return item.category || item.project || 'Other';
    }
    // القسم الفرعي (اختياري) جوه المشروع: حقل "section" في projects.json
    function sectionOf(item){
      return item.section || item.subcategory || '';
    }
    function projectFiles(name){
      return projectsData.filter((f) => projectOf(f) === name && (f.pdf || f.file));
    }
    function sectionNames(name){
      const names = [];
      projectFiles(name).forEach((f) => {
        const s = sectionOf(f);
        if (s && !names.includes(s)) names.push(s);
      });
      return names;
    }
    // أسماء المشاريع: اللي في projectMeta (بالترتيب) + أي مشروع جديد ظهر في projects.json
    function projectNames(){
      const names = Object.keys(projectMeta);
      projectsData.forEach((f) => {
        const n = projectOf(f);
        if (!names.includes(n)) names.push(n);
      });
      return names;
    }

    // رابط المعاينة: على الموبايل بنفتح الملف في عارض PDF.js (متصفحات الموبايل بتحمّل الـ PDF بدل ما تعرضه)
    function viewHref(pdf){
      if (!isMobileBrowser) return pdf;
      try {
        const abs = new URL(pdf, window.location.href).href;
        return 'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(abs);
      } catch (_) {
        return pdf;
      }
    }

    function fileRowsHtml(files){
      return '<div class="card">' + files.map((f) => {
        const pdf = f.pdf || f.file;
        const title = itemTitle(f, pdf);
        return `
      <div class="row file-row">
        <span class="row-icon"><i class="fas fa-file-pdf"></i></span>
        <span class="file-title">${escapeHtml(title)}</span>
        <span class="file-actions">
          <a class="file-btn view" href="${escapeHtml(viewHref(pdf))}" target="_blank" rel="noopener" aria-label="${escapeHtml(t('preview'))}"><i class="fas fa-eye"></i></a>
          <a class="file-btn download" href="${escapeHtml(pdf)}" download aria-label="${escapeHtml(t('download'))}"><i class="fas fa-file-download"></i></a>
        </span>
      </div>`;
      }).join('') + '</div>';
    }

    function renderProjects(){
      currentProject = null;
      currentSection = null;
      projectsOverlayTitle.textContent = t('projects');
      projectsOverlayBack.innerHTML = backBtnHtml(t('back'));
      projectDetail.style.display = 'none';
      projectsGrid.innerHTML = projectNames().map((name) => {
        const meta = projectMetaFor(name);
        const label = displayName(name);
        const count = projectsState === 'ready' ? projectFiles(name).length : null;
        const iconHtml = meta.logo
          ? `<span class="cert-category-icon has-logo"><img src="${escapeHtml(meta.logo)}" alt="${escapeHtml(label)}" onerror="this.parentNode.classList.remove('has-logo');this.parentNode.style.background='${meta.color}';this.outerHTML='<i class=&quot;fas ${meta.icon}&quot;></i>'"></span>`
          : `<span class="cert-category-icon" style="background:${meta.color}"><i class="fas ${meta.icon}"></i></span>`;
        return `
        <button type="button" class="cert-category-item" data-project="${escapeHtml(name)}">
          ${iconHtml}
          <span class="cert-category-label">${escapeHtml(label)}</span>
          ${count === null ? '' : `<span class="cert-category-count">${escapeHtml(t('fileCount', count))}</span>`}
        </button>`;
      }).join('');
      projectsGrid.style.display = 'grid';
      projectsOverlay.scrollTop = 0;
    }

    // يفتح مشروع (وقسم فرعي جواه لو section اتحدد)
    function openProject(name, section = null, updateHash = true){
      if (!projectNames().includes(name)) { renderProjects(); return; }
      if (section && projectsState === 'ready' && !sectionNames(name).includes(section)) section = null;
      currentProject = name;
      currentSection = section || null;
      if (updateHash) setProjectsHash(name, currentSection);
      const meta = projectMetaFor(name);

      projectsOverlayTitle.textContent = displayName(currentSection || name);
      projectsOverlayBack.innerHTML = backBtnHtml(currentSection ? displayName(name) : t('sections'));

      projectsGrid.innerHTML = '';
      projectsGrid.style.display = 'none';
      let html = '';

      if (projectsState === 'loading') {
        html = '<p>' + escapeHtml(t('projLoading')) + '</p>';
      } else if (projectsState === 'error') {
        html = '<p>' + escapeHtml(t('projError')) + '</p>';
      } else if (currentSection) {
        // جوه قسم فرعي: ملفاته بس
        const files = projectFiles(name).filter((f) => sectionOf(f) === currentSection);
        html = files.length
          ? fileRowsHtml(files)
          : `<p>${escapeHtml(t('projSoon', displayName(currentSection)))}</p>`;
      } else {
        // صفحة المشروع: الأقسام الفرعية كأيقونات + الملفات اللي من غير قسم
        const all = projectFiles(name);
        const sections = sectionNames(name);
        const direct = all.filter((f) => !sectionOf(f));
        if (sections.length) {
          projectsGrid.innerHTML = sections.map((s) => {
            const count = all.filter((f) => sectionOf(f) === s).length;
            return `
        <button type="button" class="cert-category-item" data-section="${escapeHtml(s)}">
          <span class="cert-category-icon" style="background:${meta.color}"><i class="fas fa-folder"></i></span>
          <span class="cert-category-label">${escapeHtml(displayName(s))}</span>
          <span class="cert-category-count">${escapeHtml(t('fileCount', count))}</span>
        </button>`;
          }).join('');
          projectsGrid.style.display = 'grid';
        }
        if (direct.length) {
          html = fileRowsHtml(direct);
        } else if (!sections.length) {
          html = `<p>${escapeHtml(t('projSoon', displayName(name)))}</p>`;
        }
      }

      if (html) {
        projectDetail.innerHTML = html;
        projectDetail.style.display = 'block';
      } else {
        projectDetail.innerHTML = '';
        projectDetail.style.display = 'none';
      }
      projectsOverlay.scrollTop = 0;
    }

    // الروابط: #projects أو #projects/Revit أو #projects/Revit/اسم القسم
    function setProjectsHash(name = null, section = null){
      let nextHash = '#projects';
      if (name) nextHash += '/' + encodeURIComponent(name);
      if (name && section) nextHash += '/' + encodeURIComponent(section);
      if (window.location.hash !== nextHash) window.location.hash = nextHash;
    }

    function openProjectsOverlay(){
      projectsOverlay.classList.add('open');
      renderProjects();
    }
    function closeProjectsOverlay(updateHash = true){
      projectsOverlay.classList.remove('open');
      if (updateHash && window.location.hash.toLowerCase().startsWith('#projects')) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    function syncProjectsFromHash(){
      const hash = window.location.hash || '';
      if (!hash.toLowerCase().startsWith('#projects')) {
        if (projectsOverlay.classList.contains('open')) closeProjectsOverlay(false);
        return;
      }
      projectsOverlay.classList.add('open');
      const raw = hash.slice('#projects'.length).replace(/^\//, '');
      if (raw) {
        const parts = raw.split('/').map((p) => {
          try { return decodeURIComponent(p); } catch (_) { return p; }
        });
        openProject(parts[0], parts[1] || null, false);
      } else {
        renderProjects();
      }
    }

    projectsBtn.addEventListener('click', () => {
      setProjectsHash();
      openProjectsOverlay();
    });
    projectsGrid.addEventListener('click', (e) => {
      const sec = e.target.closest('[data-section]');
      if (sec && currentProject) {
        openProject(currentProject, sec.getAttribute('data-section'));
        return;
      }
      const btn = e.target.closest('[data-project]');
      if (btn) openProject(btn.getAttribute('data-project'));
    });
    projectsOverlayBack.addEventListener('click', () => {
      if (currentSection) {
        openProject(currentProject);
      } else if (currentProject) {
        setProjectsHash();
        renderProjects();
      } else {
        closeProjectsOverlay(true);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && projectsOverlay.classList.contains('open')) closeProjectsOverlay();
    });
    window.addEventListener('hashchange', syncProjectsFromHash);

    // تحميل projects.json
    function refreshProjectsView(){
      if (!projectsOverlay.classList.contains('open')) return;
      if (currentProject) openProject(currentProject, currentSection, false);
      else renderProjects();
    }
    fetch('projects.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('projects.json not found');
        return res.json();
      })
      .then((data) => {
        projectsState = 'ready';
        // أي عنصر فيه "hidden": true بيتخفي من الصفحة (من غير ما تمسحه من الملف)
        projectsData = Array.isArray(data) ? data.filter((f) => f && !f.hidden) : [];
        refreshProjectsView();
      })
      .catch(() => {
        projectsState = 'error';
        refreshProjectsView();
      });

    if (window.location.hash.toLowerCase().startsWith('#projects')) syncProjectsFromHash();

    // Certificates: loaded dynamically from certificates.json
    const certGrid = document.getElementById('certGrid');
    const certEmpty = document.getElementById('certEmpty');
    const certLightbox = document.getElementById('certLightbox');
    const certLightboxImg = document.getElementById('certLightboxImg');
    const certLightboxCaption = document.getElementById('certLightboxCaption');
    const certLightboxClose = document.getElementById('certLightboxClose');
    const certLightboxShare = document.getElementById('certLightboxShare');
    let certificatesState = 'loading'; // loading | ready | error
    let certificatesData = [];

    function showCertSkeleton(){
      certLoadingText.style.display = 'block';
      certSkeletonGrid.style.display = 'grid';
      certCategoryGrid.style.display = 'none';
      certGrid.style.display = 'none';
      certEmpty.style.display = 'none';
      if (!certSkeletonGrid.childElementCount) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 6; i++) {
          const item = document.createElement('div');
          item.className = 'cert-skeleton-item';
          item.innerHTML = '<div class="cert-skeleton-img"></div><div class="cert-skeleton-label"></div>';
          frag.appendChild(item);
        }
        certSkeletonGrid.appendChild(frag);
      }
    }
    function hideCertSkeleton(){
      certLoadingText.style.display = 'none';
      certSkeletonGrid.style.display = 'none';
    }

    function groupByCategory(list){
      const map = {};
      list.forEach((c) => {
        const cat = c.category || 'Other';
        if (!map[cat]) map[cat] = [];
        map[cat].push(c);
      });
      return map;
    }

    // شاشة الأقسام (الصفحة الرئيسية لل Certifications): كل قسم أيقونة واحدة
    function renderCategories(list){
      currentCategory = null;
      certOverlayTitle.textContent = t('certifications');
      currentSub = null;
      certificatesOverlayBack.innerHTML = backBtnHtml(t('back'));
      certGrid.style.display = 'none';
      certCategoryGrid.innerHTML = '';

      const grouped = groupByCategory(list);
      const cats = Object.keys(grouped);
      hideCertSkeleton();

      if (cats.length === 0) {
        certCategoryGrid.style.display = 'none';
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
        return;
      }

      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${list.length})`;
      const frag = document.createDocumentFragment();
      cats.forEach((cat) => {
        const meta = metaFor(cat);
        const label = displayName(cat);
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'cert-category-item';
        item.setAttribute('data-category', cat);
        item.innerHTML = `
          ${categoryIconHtml(label, meta)}
          <span class="cert-category-label">${escapeHtml(label)}</span>
          <span class="cert-category-count">${escapeHtml(t('certCountLabel', grouped[cat].filter((c) => !isVideoItem(c)).length, grouped[cat].filter(isVideoItem).length))}</span>
        `;
        frag.appendChild(item);
      });
      certCategoryGrid.appendChild(frag);
      certCategoryGrid.style.display = 'grid';
    }

    certCategoryGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('.cert-category-item');
      if (!btn) return;
      const cat = btn.getAttribute('data-category');
      openCategory(cat);
    });

    // فتح قسم معيّن: يعرض بس الشهادات اللي جواه
    function openCategory(cat, updateHash = true, sub = null){
      currentCategory = cat;
      certCategoryGrid.style.display = 'none';
      const items = groupByCategory(certificatesData)[cat] || [];
      const videos = items.filter(isVideoItem);
      const certs = items.filter((c) => !isVideoItem(c));
      if (sub !== 'videos' || videos.length === 0) sub = null;
      currentSub = sub;
      if (updateHash) setCertificatesHash(cat, sub);
      if (sub === 'videos') {
        // مجلد الفيديوهات: فيديوهات بس، من غير شهادات
        certOverlayTitle.textContent = t('videosHeading');
        certificatesOverlayBack.innerHTML = backBtnHtml(displayName(cat));
        renderVideos(videos);
      } else {
        certOverlayTitle.textContent = displayName(cat);
        certificatesOverlayBack.innerHTML = backBtnHtml(t('sections'));
        renderCertificates(certs, videos.length);
      }
      certificatesOverlay.scrollTop = 0;
    }

    function openCertLightbox(fullSrc, caption){
      certLightboxImg.src = fullSrc;
      certLightboxCaption.textContent = caption || '';
      certLightbox.classList.add('open');
      certLightboxClose.style.display = 'flex';
    }
    function closeCertLightbox(){
      certLightbox.classList.remove('open');
      certLightboxClose.style.display = 'none';
      certLightboxImg.src = '';
    }

    certGrid.addEventListener('click', (e) => {
      // مجلد الفيديوهات جوه القسم
      const folderBtn = e.target.closest('[data-folder="videos"]');
      if (folderBtn && currentCategory) {
        openCategory(currentCategory, true, 'videos');
        return;
      }
      // فيديو: يفتح في نافذة تشغيل
      const vthumb = e.target.closest('.cert-video-thumb');
      if (vthumb) {
        openVideoLightbox(vthumb.getAttribute('data-video'), vthumb.getAttribute('data-title') || '');
        return;
      }
      // زر معاينة PDF
      const viewBtn = e.target.closest('.cert-view-btn');
      if (viewBtn) {
        const full = viewBtn.getAttribute('data-full');
        const label = viewBtn.getAttribute('data-title') || '';
        openCertLightbox(full, label);
        return;
      }
      // زر تحميل PDF: <a download> بيتصرف لوحده، مفيش داعي لجافاسكريبت
      if (e.target.closest('.cert-download-btn')) return;

      // الضغط على الصورة المصغّرة: يفتح لايت بوكس بالصورة
      const thumb = e.target.closest('.cert-thumb');
      if (thumb) {
        const full = thumb.getAttribute('data-full');
        const label = thumb.getAttribute('data-title') || '';
        openCertLightbox(full, label);
      }
    });
    certLightboxClose.addEventListener('click', closeCertLightbox);

    // ===== Video lightbox =====
    const videoLightbox = document.getElementById('videoLightbox');
    const videoLightboxClose = document.getElementById('videoLightboxClose');
    const videoWrap = document.getElementById('videoWrap');
    const videoCaption = document.getElementById('videoCaption');

    function openVideoLightbox(url, caption){
      const id = youtubeId(url);
      videoWrap.innerHTML = '';
      if (id) {
        const f = document.createElement('iframe');
        f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&playsinline=1';
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        f.allowFullscreen = true;
        f.referrerPolicy = 'strict-origin-when-cross-origin';
        f.title = caption || 'Video';
        videoWrap.appendChild(f);
      } else {
        const v = document.createElement('video');
        v.src = url;
        v.controls = true;
        v.autoplay = true;
        v.playsInline = true;
        videoWrap.appendChild(v);
      }
      videoCaption.textContent = caption || '';
      videoLightbox.classList.add('open');
      videoLightboxClose.style.display = 'flex';
    }
    function closeVideoLightbox(){
      videoLightbox.classList.remove('open');
      videoLightboxClose.style.display = 'none';
      videoWrap.innerHTML = ''; // بيوقف الفيديو
      videoCaption.textContent = '';
    }
    videoLightboxClose.addEventListener('click', closeVideoLightbox);
    videoLightbox.addEventListener('click', (e) => {
      if (e.target === videoLightbox) closeVideoLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && videoLightbox.classList.contains('open')) closeVideoLightbox();
    });
    certLightbox.addEventListener('click', (e) => {
      if (e.target === certLightbox) closeCertLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && certLightbox.classList.contains('open')) closeCertLightbox();
    });

    // مشاركة الشهادة المفتوحة حاليًا (صورة أو رابط حسب دعم المتصفح)
    certLightboxShare.addEventListener('click', async () => {
      const src = certLightboxImg.src;
      const caption = certLightboxCaption.textContent || t('certificate');
      try {
        if (navigator.share) {
          if (navigator.canShare) {
            const res = await fetch(src);
            const blob = await res.blob();
            const file = new File([blob], (caption || 'certificate') + '.jpg', { type: blob.type || 'image/jpeg' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: caption, text: caption });
              return;
            }
          }
          await navigator.share({ title: caption, url: src });
        } else {
          await navigator.clipboard.writeText(src);
          showToast(t('toastCertLinkCopied'));
        }
      } catch (e) {
        // المستخدم لغى المشاركة أو حصل خطأ — تجاهل بهدوء
      }
    });

    function buildVideosFolder(n){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cert-category-item';
      btn.setAttribute('data-folder', 'videos');
      btn.innerHTML = `
        <span class="cert-category-icon" style="background:#FF3B30"><i class="fas fa-play"></i></span>
        <span class="cert-category-label">${escapeHtml(t('videosHeading'))}</span>
        <span class="cert-category-count">${escapeHtml(t('videoCount', n))}</span>
      `;
      return btn;
    }
    function renderVideos(videos){
      certGrid.innerHTML = '';
      hideCertSkeleton();
      certCategoryGrid.style.display = 'none';
      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${certificatesData.length})`;
      const sortedV = [...videos].sort((a, b) => {
        const da = new Date(a.date || a.year || 0).getTime() || 0;
        const db = new Date(b.date || b.year || 0).getTime() || 0;
        return db - da;
      });
      const frag = document.createDocumentFragment();
      sortedV.forEach((v) => frag.appendChild(buildVideoCard(v)));
      certGrid.appendChild(frag);
      certGrid.style.display = 'grid';
    }
    function isVideoItem(c){
      return !!(c && c.video);
    }
    function youtubeId(url){
      try {
        const u = new URL(url, window.location.href);
        const h = u.hostname.replace(/^www\./, '');
        if (h === 'youtu.be') return u.pathname.slice(1).split('/')[0];
        if (h.endsWith('youtube.com') || h.endsWith('youtube-nocookie.com')) {
          if (u.searchParams.get('v')) return u.searchParams.get('v');
          const m = u.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/);
          if (m) return m[2];
        }
      } catch (_) {}
      return '';
    }
    function buildVideoCard(v){
      const url = v.video;
      const ytId = youtubeId(url);
      const title = itemTitle(v);
      const poster = v.thumbnail || v.image || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');

      const item = document.createElement('div');
      item.className = 'cert-item';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cert-video-thumb';
      btn.setAttribute('data-video', url);
      btn.setAttribute('data-title', title);

      if (poster) {
        const imgEl = document.createElement('img');
        imgEl.className = 'video-poster';
        imgEl.src = poster;
        imgEl.alt = title || 'Video';
        imgEl.loading = 'lazy';
        imgEl.addEventListener('load', () => imgEl.classList.add('loaded'));
        btn.appendChild(imgEl);
      } else {
        const ph = document.createElement('div');
        ph.className = 'video-poster';
        btn.appendChild(ph);
      }

      const play = document.createElement('span');
      play.className = 'video-play';
      play.innerHTML = '<i class="fas fa-play"></i>';
      btn.appendChild(play);

      const label = document.createElement('div');
      label.className = 'cert-label';
      label.textContent = title;
      btn.appendChild(label);

      item.appendChild(btn);
      return item;
    }

    function renderCertificates(list, videoCount = 0){
      certGrid.innerHTML = '';
      hideCertSkeleton();
      certCategoryGrid.style.display = 'none';
      if (!Array.isArray(list) || (list.length === 0 && videoCount === 0)){
        certGrid.style.display = 'none';
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
        return;
      }

      // ترتيب الشهادات بالأحدث أولاً لو فيه تاريخ متاح (date أو year)
      const sorted = [...list].sort((a, b) => {
        const da = new Date(a.date || a.year || 0).getTime() || 0;
        const db = new Date(b.date || b.year || 0).getTime() || 0;
        return db - da;
      });

      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${certificatesData.length})`;
      const frag = document.createDocumentFragment();
      // مجلد "Videos" بيظهر أول حاجة جوه القسم (لو فيه فيديوهات)، والشهادات تحته
      if (videoCount > 0) frag.appendChild(buildVideosFolder(videoCount));
      sorted.forEach((cert) => {
        const img = cert.image || cert.img || '';
        const full = cert.full || img;
        const title = itemTitle(cert);
        const pdf = cert.pdf || '';
        if (!img) return;

        const item = document.createElement('div');
        item.className = 'cert-item';

        const thumb = document.createElement('button');
        thumb.className = 'cert-thumb';
        thumb.type = 'button';
        thumb.style.cssText = 'display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;font:inherit;';
        thumb.setAttribute('data-full', full);
        thumb.setAttribute('data-title', title);

        const imgEl = document.createElement('img');
        imgEl.src = img;
        imgEl.alt = title || t('certificate');
        imgEl.loading = 'lazy';
        imgEl.addEventListener('load', () => imgEl.classList.add('loaded'));

        const label = document.createElement('div');
        label.className = 'cert-label';
        label.textContent = title;

        thumb.appendChild(imgEl);
        thumb.appendChild(label);
        item.appendChild(thumb);

        // زر معاينة وتحميل الـ PDF (زي اللي عند الـ CV) — بيظهروا بس لو فيه ملف pdf متحدد
        if (pdf) {
          const actions = document.createElement('div');
          actions.className = 'cert-item-actions';

          const viewBtn = document.createElement('button');
          viewBtn.className = 'btn-mini outline cert-view-btn';
          viewBtn.type = 'button';
          viewBtn.setAttribute('data-full', full);
          viewBtn.setAttribute('data-title', title);
          viewBtn.innerHTML = '<i class="fas fa-eye"></i> ' + escapeHtml(t('preview'));

          const downloadBtn = document.createElement('a');
          downloadBtn.className = 'btn-mini solid cert-download-btn';
          downloadBtn.href = pdf;
          downloadBtn.setAttribute('download', '');
          downloadBtn.innerHTML = '<i class="fas fa-file-download"></i> ' + escapeHtml(t('download'));

          actions.appendChild(viewBtn);
          actions.appendChild(downloadBtn);
          item.appendChild(actions);
        }

        frag.appendChild(item);
      });
      certGrid.appendChild(frag);
      certGrid.style.display = 'grid';
      hideCertSkeleton();
    }

    fetch('certificates.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('certificates.json not found');
        return res.json();
      })
      .then((data) => {
        certificatesState = 'ready';
        certificatesData = Array.isArray(data) ? data : [];
        // لو الشاشة مفتوحة فعلاً وقاعدة تستنى التحميل، اعرض الأقسام على طول
        if (window.location.hash.toLowerCase().startsWith('#certifications')) {
          syncCertificatesFromHash();
        } else if (certificatesOverlay.classList.contains('open')) {
          renderCategories(certificatesData);
        }
      })
      .catch(() => {
        certificatesState = 'error';
        certCategoryGrid.innerHTML = '';
        certGrid.innerHTML = '';
        hideCertSkeleton();
        certCategoryGrid.style.display = 'none';
        certGrid.style.display = 'none';
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
      });

    // افتح القسم المطلوب تلقائيًا عند دخول الزائر برابط مشاركة مباشر.
    if (window.location.hash.toLowerCase().startsWith('#certifications')) {
      syncCertificatesFromHash();
    }

    // Dark mode: follow system by default, allow manual override
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyStoredTheme(){
      const saved = localStorage.getItem('theme'); // 'light' | 'dark' | null
      if (saved === 'light' || saved === 'dark') {
        root.setAttribute('data-theme', saved);
      } else {
        root.removeAttribute('data-theme'); // follow system
      }
    }

    themeToggle.addEventListener('click', () => {
      const currentlyDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && systemDark.matches);
      const next = currentlyDark ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      root.setAttribute('data-theme', next);
    });

    // If user hasn't manually overridden, react live to system changes
    systemDark.addEventListener('change', () => {
      if (!localStorage.getItem('theme')) applyStoredTheme();
    });

    applyStoredTheme();

    // Toast helper
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // Shared contact info
    const CONTACT = {
      name: 'Mohamed Shaban',
      phone: '+201094517814',
      email: 'eng.m.shaban.kfs@gmail.com',
      site: 'https://engshab.blogspot.com/'
    };

    // Copy WhatsApp number
    document.getElementById('copyNumberBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(CONTACT.phone);
        showToast(t('toastCopied'));
      } catch (e) {
        showToast(t('toastCopyFail'));
      }
    });

    // Save contact as vCard
    document.getElementById('saveContactBtn').addEventListener('click', () => {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Mohamed_Shaban.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(t('toastSaved'));
    });

    // Share profile
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = {
        title: t('pageTitle'),
        text: t('shareText'),
        url: window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(shareData.url);
          showToast(t('toastLinkCopied'));
        } catch (e) {
          showToast(t('toastShareFail'));
        }
      }
    });

    // QR code sheet
    const qrSheet = document.getElementById('qrSheet');
    const qrSheetCancel = document.getElementById('qrSheetCancel');
    const qrImage = document.getElementById('qrImage');
    const qrTabSite = document.getElementById('qrTabSite');
    const qrTabWhatsapp = document.getElementById('qrTabWhatsapp');
    const qrTabContact = document.getElementById('qrTabContact');
    const qrTabs = [qrTabSite, qrTabWhatsapp, qrTabContact];

    function qrUrl(data){
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(data)}`;
    }
    function contactVcardText(){
      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
    }
    function setQrTab(tab){
      qrTabs.forEach((btn) => btn.classList.remove('active'));
      if (tab === 'site') {
        qrImage.src = qrUrl(window.location.href);
        qrTabSite.classList.add('active');
      } else if (tab === 'whatsapp') {
        qrImage.src = qrUrl(`https://wa.me/${CONTACT.phone.replace('+','')}`);
        qrTabWhatsapp.classList.add('active');
      } else {
        // مسح مباشر بالكاميرا بيحفظ جهة الاتصال كاملة على الموبايل
        qrImage.src = qrUrl(contactVcardText());
        qrTabContact.classList.add('active');
      }
    }
    document.getElementById('qrBtn').addEventListener('click', () => {
      setQrTab('site');
      qrSheet.classList.add('open');
    });
    qrTabSite.addEventListener('click', () => setQrTab('site'));
    qrTabWhatsapp.addEventListener('click', () => setQrTab('whatsapp'));
    qrTabContact.addEventListener('click', () => setQrTab('contact'));
    qrSheetCancel.addEventListener('click', () => qrSheet.classList.remove('open'));
    qrSheet.addEventListener('click', (e) => {
      if (e.target === qrSheet) qrSheet.classList.remove('open');
    });

    // ===================== Language switch =====================
    const langToggle = document.getElementById('langToggle');
    const langLabel = document.getElementById('langLabel');
    const metaDescEl = document.querySelector('meta[name="description"]');

    function applyLang(){
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t('pageTitle');
      if (metaDescEl) metaDescEl.setAttribute('content', t('metaDesc'));

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
      });
      langLabel.textContent = t('langBtn');
      updateCvBtn();

      // ابدأ كتابة النصوص من الأول باللغة الجديدة
      textIndex = 0;
      charIndex = 0;
      isDeleting = false;
      typingEl.textContent = '';

      // أعد رسم الشاشات المفتوحة باللغة الجديدة
      if (certificatesOverlay.classList.contains('open') && certificatesState === 'ready') {
        if (currentCategory) openCategory(currentCategory, false, currentSub);
        else renderCategories(certificatesData);
      }
      if (projectsOverlay.classList.contains('open')) refreshProjectsView();
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      // مفيش حفظ للغة: كل ما الصفحة تتفتح من جديد ترجع إنجليزي
      applyLang();
    });

    applyLang();
  </script>
</body>
</html>
