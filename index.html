    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --secondary: #98989d;
        --blue: #0a84ff;
        --separator: #38383a;
        --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);

    [data-theme="dark"]{
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #98989d;
      --blue: #0a84ff;
      --separator: #38383a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --sheet-bg: rgba(28,28,30,0.97);
      color-scheme: dark;
    }

    *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display:flex;
      justify-content:center;
      padding: 56px 16px;
      transition: background .3s ease, color .3s ease;
    }

    /* theme toggle */
    .theme-toggle{
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: var(--shadow);
      border: none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color: var(--text);
      font-size: 16px;
      z-index: 50;
      transition: background .3s ease, color .3s ease, transform .15s ease;
    }
    .theme-toggle:active{ transform: scale(0.92); }
    .theme-toggle .fa-sun{ display:none; }
    .theme-toggle .fa-moon{ display:inline; }
    [data-theme="dark"] .theme-toggle .fa-sun{ display:inline; color:#ffd60a; }
    [data-theme="dark"] .theme-toggle .fa-moon{ display:none; }
    @media (prefers-color-scheme: dark){
      html:not([data-theme="light"]) .theme-toggle .fa-sun{ display:inline; color:#ffd60a; }
      html:not([data-theme="light"]) .theme-toggle .fa-moon{ display:none; }
    }

    .container{
      width:100%;
      max-width: 400px;
    }

    /* profile header */
    .profile-header{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      margin-bottom: 28px;
    }

    .profile-pic{
      width: 148px;
      height: 148px;
      border-radius: 50%;
      overflow:hidden;
      box-shadow: var(--shadow);
      border: 3px solid var(--card);
      margin-bottom: 16px;
      transition: transform .2s ease;
      padding:0;
      background:none;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }
    .profile-pic:active{ transform: scale(0.97); }
    .profile-pic img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    h1{
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }

    .status-line{
      font-size: 15px;
      color: var(--secondary);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 20px;
    }
    .typing{
      white-space:nowrap;
      overflow:hidden;
      border-right: 2px solid var(--blue);
      animation: blink-cursor .8s steps(1) infinite;
      padding-right:2px;
      color: var(--blue);
      font-weight: 700;
    }
    @keyframes blink-cursor{ 50%{ border-color: transparent; } }

    /* grouped list card */
    .group-title{
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 8px 14px;
    }

    .card{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .row{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px 16px;
      text-decoration:none;
      color: var(--text);
      position: relative;
      transition: background .15s ease;
    }
    .row:active{ background: rgba(120,120,128,0.12); }
    .row + .row{ border-top: 1px solid var(--separator); }
    button.row{
      width:100%;
      background: none;
      font-family: inherit;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      border:none;
      outline:none;
      margin:0;
    }

    .row-icon{
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size: 15px;
      flex-shrink:0;
    }
    .icon-whatsapp{ background:#25D366; }
    .icon-email{ background:#8E8E93; }
    .icon-linkedin{ background:#0A66C2; }
    .icon-facebook{ background:#1877F2; }
    .icon-youtube{ background:#FF0000; }
    .icon-telegram{ background:#229ED9; }
    .icon-group{ background:#5856D6; }
    .icon-blog{ background:#FF9500; }

    .row-label{
      flex:1;
      font-size: 15.5px;
      font-weight: 500;
      text-align: left;
    }

    .row-chevron{
      color: #c7c7cc;
      font-size: 13px;
    }

    /* CV actions */
    .cv-actions{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration:none;
      cursor:pointer;
      border: none;
      font-family: inherit;
      transition: opacity .15s ease, transform .1s ease;
    }
    .btn:active{ transform: scale(0.985); opacity:0.9; }

    .btn.solid{
      background: var(--blue);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .btn.outline{
      background: var(--card);
      color: var(--blue);
      box-shadow: var(--shadow);
    }

    /* inline CV viewer */
    .cv-viewer{
      max-height:0;
      overflow:hidden;
      margin-top:0;
      border-radius: 14px;
      transition: max-height .4s ease, margin-top .4s ease;
      background: var(--card);
    }
    .cv-viewer.open{
      max-height:600px;
      margin-top:14px;
      box-shadow: var(--shadow);
    }
    .cv-viewer iframe{
      width:100%;
      height:560px;
      border:0;
      border-radius: 14px;
      background:#fff;
      display:block;
    }

    /* ===== Certificates overlay ===== */
    .cert-overlay-backdrop{
      position:fixed;
      inset:0;
      background: var(--bg);
      z-index: 160;
      opacity:0;
      pointer-events:none;
      transform: translateY(12px);
      transition: opacity .25s ease, transform .25s ease;
      overflow-y:auto;
      -webkit-overflow-scrolling: touch;
    }
    .cert-overlay-backdrop.open{
      opacity:1;
      pointer-events:auto;
      transform: translateY(0);
    }
    .cert-overlay-header{
      position:sticky;
      top:0;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--separator);
      z-index: 1;
    }
    .cert-overlay-back{
      display:flex;
      align-items:center;
      gap:8px;
      background: var(--card);
      color: var(--blue);
      border:none;
      border-radius: 20px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .cert-overlay-back:active{ transform: scale(0.95); }
    .cert-overlay-title{
      flex:1;
      text-align:center;
      font-size: 16px;
      font-weight: 700;
      margin-right: 40px;
    }
    .cert-overlay-body{
      padding: 16px;
      max-width: 400px;
      margin: 0 auto;
    }

    /* ===== Certificates section ===== */
    .cert-grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    /* Skeleton loading placeholders */
    .cert-skeleton-item{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cert-skeleton-item .cert-skeleton-img{
      height: 108px;
      background: linear-gradient(90deg, var(--separator) 25%, rgba(120,120,128,0.18) 37%, var(--separator) 63%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }
    .cert-skeleton-item .cert-skeleton-label{
      height: 12px;
      margin: 10px 14px 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--separator) 25%, rgba(120,120,128,0.18) 37%, var(--separator) 63%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }
    @keyframes skeleton-shimmer{
      0%{ background-position: 100% 50%; }
      100%{ background-position: 0 50%; }
    }
    .cert-loading-text{
      text-align:center;
      color: var(--secondary);
      font-size: 13px;
      margin: -8px 0 16px;
      display:none;
    }

    .row-label small{
      color: var(--secondary);
      font-weight: 500;
      font-size: 13px;
    }

    /* certificate image fade-in once loaded */
    .cert-item img{
      opacity:0;
      transition: opacity .25s ease;
    }
    .cert-item img.loaded{ opacity:1; }

    /* share button inside certificate lightbox */
    .lightbox-share{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:14px;

      border-radius: 20px;
      padding: 9px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor:pointer;
    }
    .lightbox-share:active{ transform: scale(0.95); }
    .cert-item{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow:hidden;
      cursor:pointer;
      border:none;
      padding:0;
      font-family:inherit;
      text-align:left;
      transition: transform .1s ease, opacity .15s ease;

      display:block;

    /* lightbox for full certificate / profile picture view */
    .lightbox-backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:200;
      opacity:0;
      pointer-events:none;
      padding: 24px;
      transition: background .25s ease, opacity .25s ease;
    }
    .lightbox-backdrop.open{
      background: rgba(0,0,0,0.85);
      opacity:1;
      pointer-events:auto;
    }
    .lightbox-content{
      max-width:100%;
      max-height:80vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display:block;

      color:#fff;
      text-align:center;

      font-weight:600;

      top:18px;
      right:18px;

      height:40px;

      background: rgba(255,255,255,0.15);

    .lightbox-back{

      align-items:center;

    }
    .lightbox-back:active{ transform: scale(0.95); background: rgba(255,255,255,0.28); }

    .lightbox-inner{
      display:flex;
      flex-direction:column;
      align-items:center;

    /* action sheet */
    .sheet-backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0);

      justify-content:center;

    }
    .sheet-backdrop.open{
      background: rgba(0,0,0,0.35);
      opacity:1;
      pointer-events:auto;
    }
    .sheet{

      max-width: 400px;
      margin: 0 16px 16px;
      transform: translateY(110%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .sheet-backdrop.open .sheet{
      transform: translateY(0);
    }
    .sheet-group{
      background: var(--sheet-bg);
      border-radius: 14px;
      overflow:hidden;
      margin-bottom: 8px;
      text-align:center;
    }
    .sheet-title{
      padding: 14px 16px 12px;
      font-size: 13px;
      color: var(--secondary);
      border-bottom: 1px solid var(--separator);
    }
    .sheet-option{
      display:block;
      width:100%;
      padding: 15px 16px;
      background:none;
      border:none;
      font-family:inherit;
      font-size: 17px;
      font-weight: 500;
      color: var(--blue);
      text-decoration:none;
      cursor:pointer;
    }
    .sheet-option:active{ background: rgba(120,120,128,0.16); }
    .sheet-option + .sheet-option{ border-top: 1px solid var(--separator); }
    .sheet-cancel{
      display:block;
      width:100%;
      padding: 15px 16px;
      background: var(--sheet-bg);
      border-radius: 14px;
      border:none;
      font-family:inherit;
      font-size: 17px;
      font-weight: 600;
      color: var(--blue);
      cursor:pointer;
    }
    .sheet-cancel:active{ background: rgba(120,120,128,0.16); }

    /* quick actions row (icon-only buttons) */
    .quick-actions{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .quick-action{
      background: var(--card);
      border: none;
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 8px;
      cursor:pointer;
      font-family: inherit;
      color: var(--text);
      transition: transform .1s ease, opacity .15s ease;
    }
    .quick-action:active{ transform: scale(0.95); opacity:0.85; }
    .quick-action i{ font-size: 17px; color: var(--blue); }
    .quick-action span{ font-size: 11.5px; font-weight: 600; text-align:center; line-height:1.2; }

    /* QR sheet */
    .qr-box{
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      display:flex;
      justify-content:center;
      margin: 4px 0 14px;
    }
    .qr-box img{
      width: 190px;
      height: 190px;
      display:block;
    }
    .qr-tabs{
      display:flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .qr-tab{
      flex:1;
      padding: 8px 4px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      background: rgba(120,120,128,0.12);
      color: var(--text);
      cursor:pointer;
      white-space:nowrap;
    }
    .qr-tab.active{
      background: var(--blue);
      color:#fff;
    }

    /* toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(28,28,30,0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 250;
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      white-space:nowrap;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

        <span class="row-icon icon-facebook"><i class="fab fa-facebook-f"></i></span>
        <span class="row-label">Facebook</span>
        <i class="fas fa-chevron-right row-chevron"></i>
      </a>
      <a class="row" href="https://youtube.com/@eng.m.shaban?si=_45glZ1-534MI1eC" target="_blank">
        <span class="row-icon icon-youtube"><i class="fab fa-youtube"></i></span>
        <span class="row-label">YouTube</span>
        <i class="fas fa-chevron-right row-chevron"></i>
      </a>
      <button class="row" id="telegramBtn" type="button">
        <span class="row-icon icon-telegram"><i class="fab fa-telegram-plane"></i></span>
        <span class="row-label">Telegram</span>
        <i class="fas fa-chevron-right row-chevron"></i>
      </button>
      <a class="row" href="https://engshab.blogspot.com/" target="_blank">
        <span class="row-icon icon-blog"><i class="fas fa-globe"></i></span>
        <span class="row-label">M.Shaban</span>
        <i class="fas fa-chevron-right row-chevron"></i>
      </a>
      <button class="row" id="certificatesBtn" type="button">
        <span class="row-icon icon-group"><i class="fas fa-certificate"></i></span>
        <span class="row-label">Certifications <small id="certCount"></small></span>
        <i class="fas fa-chevron-right row-chevron"></i>
      </button>
    </div>

    <div class="group-title">Curriculum Vitae</div>
    <div class="cv-actions">
      <button class="btn outline" id="viewCvBtn" type="button">
        <i class="fas fa-eye"></i> View CV
      </button>
      <a class="btn solid" href="cv.pdf" download>
        <i class="fas fa-file-download"></i> Download CV
      </a>
    </div>

    <div class="cv-viewer" id="cvViewer">
      <iframe id="cvFrame" src="" title="CV Preview"></iframe>
    </div>

    <footer>Mechanical Power &amp; Energy Engineering</footer>
  </div>

  <!-- ===== Certificates overlay =====
       بتتفتح بالضغط على زرار "الشهادات". البيانات بتتحمّل تلقائي من ملف
       certificates.json (نفس مجلد الصفحة). عايز تضيف/تشيل شهادة؟
       مش هتلمس الكود خالص هنا — عدّل ملف certificates.json بس. -->
  <div class="cert-overlay-backdrop" id="certificatesOverlay">
    <div class="cert-overlay-header">
      <button class="cert-overlay-back" id="certificatesOverlayBack" type="button">
        <i class="fas fa-arrow-right"></i> رجوع
      </button>
      <div class="cert-overlay-title">Certifications</div>
    </div>
    <div class="cert-overlay-body">
      <div class="cert-loading-text" id="certLoadingText">جاري تحميل الشهادات...</div>
      <div class="cert-grid" id="certSkeletonGrid" style="display:none;"></div>
      <div class="cert-grid" id="certGrid"></div>
      <div id="certEmpty" style="display:none; text-align:center; color:var(--secondary); font-size:13px; margin-top:8px;">
        لا توجد شهادات بعد
      </div>
    </div>
  </div>

  <!-- Profile picture lightbox (مع زر رجوع للصفحة الرئيسية) -->
  <button class="lightbox-back" id="profileLightboxBack" type="button">
    <i class="fas fa-arrow-right"></i> رجوع للصفحة الرئيسية
  </button>
  <div class="lightbox-backdrop" id="profileLightbox">
    <div class="lightbox-inner">
      <img class="lightbox-content" src="me.jpg" alt="ENG Mohamed Shaban">
    </div>
  </div>

  <!-- Certificate lightbox -->
  <button class="lightbox-close" id="certLightboxClose" type="button" style="display:none;" aria-label="Close">
    <i class="fas fa-xmark"></i>
  </button>
  <div class="lightbox-backdrop" id="certLightbox">
    <div class="lightbox-inner">
      <img class="lightbox-content" id="certLightboxImg" src="" alt="Certificate">
      <div class="lightbox-caption" id="certLightboxCaption"></div>
      <button class="lightbox-share" id="certLightboxShare" type="button">
        <i class="fas fa-share-nodes"></i> مشاركة الشهادة
      </button>
    </div>
  </div>

  <div class="sheet-backdrop" id="telegramSheet">
    <div class="sheet">
      <div class="sheet-group">
        <div class="sheet-title">اختر</div>
        <a class="sheet-option" href="https://t.me/ENG_M_Shaban" target="_blank">الملف الشخصي</a>
        <a class="sheet-option" href="https://t.me/EngMShaban" target="_blank">قناة التلجرام</a>
      </div>
      <button class="sheet-cancel" id="telegramSheetCancel" type="button">إلغاء</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="qrSheet">
    <div class="sheet">
      <div class="sheet-group" style="padding:16px;">
        <div class="qr-tabs">
          <button class="qr-tab active" id="qrTabSite" type="button">الموقع</button>
          <button class="qr-tab" id="qrTabWhatsapp" type="button">واتساب</button>
          <button class="qr-tab" id="qrTabContact" type="button">جهة الاتصال</button>
        </div>
        <div class="qr-box">
          <img id="qrImage" src="" alt="QR Code">
        </div>
      </div>
      <button class="sheet-cancel" id="qrSheetCancel" type="button">إغلاق</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Typing effect
    const texts = [
      "Mechanical Power Engineer",
      "Energy & Machines Specialist",
      "Industrial Maintenance Expert",
      "Always Learning & Innovating"
    ];
    const typingEl = document.getElementById('typing');
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function tick() {
      const current = texts[textIndex];
      if (!isDeleting) {
        charIndex++;
        typingEl.textContent = current.slice(0, charIndex);
      } else {
        charIndex--;
        typingEl.textContent = current.slice(0, charIndex);
      }

      let delay = isDeleting ? 55 : 110;

      if (!isDeleting && charIndex === current.length) {
        delay = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        delay = 300;
      }
      setTimeout(tick, delay);
    }
    tick();

    // View CV toggle (inline viewer)
    const viewCvBtn = document.getElementById('viewCvBtn');
    const cvViewer = document.getElementById('cvViewer');
    const cvFrame = document.getElementById('cvFrame');
    let cvLoaded = false;

    viewCvBtn.addEventListener('click', () => {
      const isOpen = cvViewer.classList.toggle('open');
      if (isOpen) {
        if (!cvLoaded) {
          cvFrame.src = 'cv.pdf';
          cvLoaded = true;
        }
        viewCvBtn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide CV';
        cvViewer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        viewCvBtn.innerHTML = '<i class="fas fa-eye"></i> View CV';
      }
    });

    // Telegram action sheet
    const telegramBtn = document.getElementById('telegramBtn');
    const telegramSheet = document.getElementById('telegramSheet');
    const telegramSheetCancel = document.getElementById('telegramSheetCancel');

    function openTelegramSheet(){
      telegramSheet.classList.add('open');
    }
    function closeTelegramSheet(){
      telegramSheet.classList.remove('open');
    }

    telegramBtn.addEventListener('click', openTelegramSheet);
    telegramSheetCancel.addEventListener('click', closeTelegramSheet);
    telegramSheet.addEventListener('click', (e) => {
      if (e.target === telegramSheet) closeTelegramSheet();
    });

    // Profile picture lightbox (مع زر رجوع للصفحة الرئيسية)
    const profilePicBtn = document.getElementById('profilePicBtn');
    const profileLightbox = document.getElementById('profileLightbox');
    const profileLightboxBack = document.getElementById('profileLightboxBack');

    function openProfileLightbox(){
      profileLightbox.classList.add('open');
      profileLightboxBack.style.display = 'flex';
    }
    function closeProfileLightbox(){
      profileLightbox.classList.remove('open');
      profileLightboxBack.style.display = 'none';
    }

    profilePicBtn.addEventListener('click', openProfileLightbox);
    profileLightboxBack.addEventListener('click', closeProfileLightbox);
    profileLightbox.addEventListener('click', (e) => {
      if (e.target === profileLightbox) closeProfileLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && profileLightbox.classList.contains('open')) closeProfileLightbox();
    });

    // Certificates overlay open/close
    const certificatesBtn = document.getElementById('certificatesBtn');
    const certificatesOverlay = document.getElementById('certificatesOverlay');
    const certificatesOverlayBack = document.getElementById('certificatesOverlayBack');
    const certCountEl = document.getElementById('certCount');
    const certSkeletonGrid = document.getElementById('certSkeletonGrid');
    const certLoadingText = document.getElementById('certLoadingText');

    function openCertificatesOverlay(){
      certificatesOverlay.classList.add('open');
      certificatesOverlay.scrollTop = 0;
      // لو البيانات لسه ما وصلتش، اعرض حالة التحميل بدل شاشة فاضية
      if (certificatesState === 'loading') {
        showCertSkeleton();
      }
    }
    function closeCertificatesOverlay(){
      certificatesOverlay.classList.remove('open');
    }

    certificatesBtn.addEventListener('click', openCertificatesOverlay);
    certificatesOverlayBack.addEventListener('click', closeCertificatesOverlay);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && certificatesOverlay.classList.contains('open')) closeCertificatesOverlay();
    });

    // Certificates: loaded dynamically from certificates.json
    const certGrid = document.getElementById('certGrid');
    const certEmpty = document.getElementById('certEmpty');
    const certLightbox = document.getElementById('certLightbox');
    const certLightboxImg = document.getElementById('certLightboxImg');
    const certLightboxCaption = document.getElementById('certLightboxCaption');
    const certLightboxClose = document.getElementById('certLightboxClose');
    const certLightboxShare = document.getElementById('certLightboxShare');
    let certificatesState = 'loading'; // loading | ready | error

    function showCertSkeleton(){
      certLoadingText.style.display = 'block';
      certSkeletonGrid.style.display = 'grid';
      certGrid.style.display = 'none';
      certEmpty.style.display = 'none';
      if (!certSkeletonGrid.childElementCount) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 6; i++) {
          const item = document.createElement('div');
          item.className = 'cert-skeleton-item';
          item.innerHTML = '<div class="cert-skeleton-img"></div><div class="cert-skeleton-label"></div>';
          frag.appendChild(item);
        }
        certSkeletonGrid.appendChild(frag);
      }
    }
    function hideCertSkeleton(){
      certLoadingText.style.display = 'none';
      certSkeletonGrid.style.display = 'none';
      certGrid.style.display = 'grid';
    }

    function openCertLightbox(fullSrc, caption){
      certLightboxImg.src = fullSrc;
      certLightboxCaption.textContent = caption || '';
      certLightbox.classList.add('open');
      certLightboxClose.style.display = 'flex';
    }
    function closeCertLightbox(){
      certLightbox.classList.remove('open');
      certLightboxClose.style.display = 'none';
      certLightboxImg.src = '';
    }

    certGrid.addEventListener('click', (e) => {
      const item = e.target.closest('.cert-item');
      if (!item) return;
      const full = item.getAttribute('data-full');
      const label = item.querySelector('.cert-label')?.textContent || '';
      openCertLightbox(full, label);
    });
    certLightboxClose.addEventListener('click', closeCertLightbox);
    certLightbox.addEventListener('click', (e) => {
      if (e.target === certLightbox) closeCertLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && certLightbox.classList.contains('open')) closeCertLightbox();
    });

    // مشاركة الشهادة المفتوحة حاليًا (صورة أو رابط حسب دعم المتصفح)
    certLightboxShare.addEventListener('click', async () => {
      const src = certLightboxImg.src;
      const caption = certLightboxCaption.textContent || 'شهادة';
      try {
        if (navigator.share) {
          if (navigator.canShare) {
            const res = await fetch(src);
            const blob = await res.blob();
            const file = new File([blob], (caption || 'certificate') + '.jpg', { type: blob.type || 'image/jpeg' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: caption, text: caption });
              return;
            }
          }
          await navigator.share({ title: caption, url: src });
        } else {
          await navigator.clipboard.writeText(src);
          showToast('تم نسخ رابط الشهادة');
        }
      } catch (e) {
        // المستخدم لغى المشاركة أو حصل خطأ — تجاهل بهدوء
      }
    });

    function renderCertificates(list){
      certGrid.innerHTML = '';
      if (!Array.isArray(list) || list.length === 0){
        hideCertSkeleton();
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
        return;
      }

      // ترتيب الشهادات بالأحدث أولاً لو فيه تاريخ متاح (date أو year)
      const sorted = [...list].sort((a, b) => {
        const da = new Date(a.date || a.year || 0).getTime() || 0;
        const db = new Date(b.date || b.year || 0).getTime() || 0;
        return db - da;
      });

      certEmpty.style.display = 'none';
      certCountEl.textContent = `(${sorted.length})`;
      const frag = document.createDocumentFragment();
      sorted.forEach((cert) => {
        const img = cert.image || cert.img || '';
        const full = cert.full || img;
        const title = cert.title || cert.name || '';
        if (!img) return;

        const btn = document.createElement('button');
        btn.className = 'cert-item';
        btn.type = 'button';
        btn.setAttribute('data-full', full);

        const imgEl = document.createElement('img');
        imgEl.src = img;
        imgEl.alt = title || 'Certificate';
        imgEl.loading = 'lazy';
        imgEl.addEventListener('load', () => imgEl.classList.add('loaded'));

        const label = document.createElement('div');
        label.className = 'cert-label';
        label.textContent = title;

        btn.appendChild(imgEl);
        btn.appendChild(label);
        frag.appendChild(btn);
      });
      certGrid.appendChild(frag);
      hideCertSkeleton();
    }

    fetch('certificates.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('certificates.json not found');
        return res.json();
      })
      .then((data) => {
        certificatesState = 'ready';
        renderCertificates(data);
      })
      .catch(() => {
        certificatesState = 'error';
        certGrid.innerHTML = '';
        hideCertSkeleton();
        certEmpty.style.display = 'block';
        certCountEl.textContent = '';
      });

    // Dark mode: follow system by default, allow manual override
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyStoredTheme(){
      const saved = localStorage.getItem('theme'); // 'light' | 'dark' | null
      if (saved === 'light' || saved === 'dark') {
        root.setAttribute('data-theme', saved);
      } else {
        root.removeAttribute('data-theme'); // follow system
      }
    }

    themeToggle.addEventListener('click', () => {
      const currentlyDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && systemDark.matches);
      const next = currentlyDark ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      root.setAttribute('data-theme', next);
    });

    // If user hasn't manually overridden, react live to system changes
    systemDark.addEventListener('change', () => {
      if (!localStorage.getItem('theme')) applyStoredTheme();
    });

    applyStoredTheme();

    // Toast helper
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // Shared contact info
    const CONTACT = {
      name: 'Mohamed Shaban',
      phone: '+201094517814',
      email: 'eng.m.shaban.kfs@gmail.com',
      site: 'https://engshab.blogspot.com/'
    };

    // Copy WhatsApp number
    document.getElementById('copyNumberBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(CONTACT.phone);
        showToast('تم نسخ الرقم');
      } catch (e) {
        showToast('تعذر نسخ الرقم');
      }
    });

    // Save contact as vCard
    document.getElementById('saveContactBtn').addEventListener('click', () => {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Mohamed_Shaban.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('تم حفظ جهة الاتصال');
    });

    // Share profile
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = {
        title: 'Mohamed Shaban | Mechanical Engineer',
        text: 'تواصل مع المهندس محمد شعبان',
        url: window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(shareData.url);
          showToast('تم نسخ رابط الصفحة');
        } catch (e) {
          showToast('تعذر مشاركة الرابط');
        }
      }
    });

    // QR code sheet
    const qrSheet = document.getElementById('qrSheet');
    const qrSheetCancel = document.getElementById('qrSheetCancel');
    const qrImage = document.getElementById('qrImage');
    const qrTabSite = document.getElementById('qrTabSite');
    const qrTabWhatsapp = document.getElementById('qrTabWhatsapp');
    const qrTabContact = document.getElementById('qrTabContact');
    const qrTabs = [qrTabSite, qrTabWhatsapp, qrTabContact];

    function qrUrl(data){
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(data)}`;
    }
    function contactVcardText(){
      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${CONTACT.name}`,
        `TEL;TYPE=CELL:${CONTACT.phone}`,
        `EMAIL:${CONTACT.email}`,
        `URL:${CONTACT.site}`,
        'END:VCARD'
      ].join('\n');
    }
    function setQrTab(tab){
      qrTabs.forEach((btn) => btn.classList.remove('active'));
      if (tab === 'site') {
        qrImage.src = qrUrl(window.location.href);
        qrTabSite.classList.add('active');
      } else if (tab === 'whatsapp') {
        qrImage.src = qrUrl(`https://wa.me/${CONTACT.phone.replace('+','')}`);
        qrTabWhatsapp.classList.add('active');
      } else {
        // مسح مباشر بالكاميرا بيحفظ جهة الاتصال كاملة على الموبايل
        qrImage.src = qrUrl(contactVcardText());
        qrTabContact.classList.add('active');
      }
    }
    document.getElementById('qrBtn').addEventListener('click', () => {
      setQrTab('site');
      qrSheet.classList.add('open');
    });
    qrTabSite.addEventListener('click', () => setQrTab('site'));
    qrTabWhatsapp.addEventListener('click', () => setQrTab('whatsapp'));
    qrTabContact.addEventListener('click', () => setQrTab('contact'));
    qrSheetCancel.addEventListener('click', () => qrSheet.classList.remove('open'));
    qrSheet.addEventListener('click', (e) => {
      if (e.target === qrSheet) qrSheet.classList.remove('open');
    });
  </script>
</body>
</html>
